  title: { nb: Spørsmålskort, en: Question card }
  zones: [main]
  sharing: everyone
  events: [ask]
  states: [filled]
  texts:
    nb: { label: 'Spørsmålet ditt:', again: Spør igjen }
    en: { label: 'Your question:', again: Ask again }
