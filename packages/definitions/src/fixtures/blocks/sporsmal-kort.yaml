    version: 1
    root:
      type: card
      variant: tinted
      children:
        - type: paragraph
          text: [{ t: label }, ' ', { bind: question.text }]
        - type: button
          variant: secondary
          text: { t: again }
          event: { name: ask, question: { bind: question.text } }
