            document: 6e02070bd204
            position: 2
        answerPattern: (?i)Altinn\.FileAnalyzers|AddMimeTypeValidation|enabledFileAnalysers|enabledFileValidators|mimeTypeAnalyser|mimeTypeValidator|JsonObjectInDataResponse
        referenceAnswer: 'For å ta i bruk MIME-type-validering kreves fire steg: (1) Legg til en referanse til Altinn.FileAnalyzers NuGet-pakken ved å kjøre `nuget install Altinn.FileAnalyzers` i App-mappen; (2) Registrer tjenesten med `services.AddMimeTypeValidation();`; (3) Konfigurer validatoren per datatype i applicationmetadata.json ved å sette enabledFileAnalysers til ["mimeTypeAnalyser"] og enabledFileValidators til ["mimeTypeValidator"] (sammen med f.eks. allowedContentTypes, taskId, maxSize, maxCount, minCount); og (4) Legg til støtte for JSON-objekter i dataresponsen ved å sette FeatureManagement.JsonObjectInDataResponse til true, slik at frontend ser etter JSON i svaret for å gi en feilmelding.'
      grounding: sources-and-answer
