    - id: wg-dialog-01-fce-cps-validering
      split: train
      input: When a Content Provision Service (CPS) receives a front-channel-embed request from an end-user system in Dialogporten, what must it validate before responding?
      expected:
        sources:
          - chunkId: cd18fc1e47aa
            document: 45bc34e4087e
            position: 3
        answerPattern: (?i)signature|JWK|expired|Origin
        referenceAnswer: The CPS must validate the received dialog token by checking the token signature against the JWKs published by Dialogporten and by checking that the token is not expired. It may perform additional validations (for example checking the 'actions' claim). It may validate the Origin header, but must not rely on this header alone for authorization purposes, because it can be easily spoofed. Given successful authorization and no other errors, the CPS must respond with 200 OK (or 204 No Content if the body is empty) and a Content-Type header matching the FCE media type (currently text/markdown or text/html).
      grounding: sources-and-answer
      tags:
        - altinn-dialogporten
        - hard
        - lookup
      origin:
        source: new
        dataset: public-docs
