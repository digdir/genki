        referenceAnswer: 'Viktige hensyn: (1) Forespørsler som kan spesifisere ServiceCode/ServiceEdition overføres umiddelbart til Altinn 3 via Altinn 3 Broker Bridge; hvis SC/SE kan spesifiseres, men ikke er det, overføres ikke forespørselen. (2) Forespørsler som ikke kan spesifisere SC/SE gjør først oppslag i Altinn 2 Formidlings datalager, og dersom ingenting finnes, overføres forespørselen til Altinn 3. (3) Filer i Altinn 3 kan ikke være større enn 1 GB (maksimal filstørrelse i Altinn 2), og tjenesten i Altinn 3 skal konfigureres med denne MaxFileSize-begrensningen. (4) Fildata og metadata lagres i Altinn 3 datalager, mens Altinn 2-kall overføres til Altinn 3. (5) Kvitteringer lagres ikke lenger i Altinn 2; en pseudokvittering genereres fra Altinn 3-metadata, og kvitterings-tjenesten i Altinn 2 brukes ikke lenger for overførte formidlingstjenester. (6) Bruk av manifestfilen i innsendt fildata støttes ikke lenger i Altinn 3, men funksjonalitet for manifest-filer kan skrus på i overgangsløsningen.'
