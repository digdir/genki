    - id: wg-broker-06-transition-considerations-en
      split: train
      input: What are the key technical considerations when using the Altinn 2 to Altinn 3 Broker transition solution?
      expected:
        sources:
          - chunkId: 01fdec6b497d
            document: b6c43b81c669
            position: 2
        answerPattern: (?i)ServiceCode|ServiceEdition|Broker Bridge|1 GB|MaxFileSize|receipt|pseudo receipt|Manifest
        referenceAnswer: "Key considerations: (1) Requests that can specify ServiceCode/ServiceEdition are immediately transferred to Altinn 3 via the Altinn 3 Broker Bridge; if SC/SE can be specified but aren't, requests are not transferred. (2) Requests that cannot specify SC/SE first query Altinn 2 Broker storage, and if nothing is found, a call is made to Altinn 3. (3) Files in Altinn 3 cannot be larger than 1 GB (the Altinn 2 maximum), so the Altinn 3 Resource should be configured with this max filesize restriction. (4) File data and metadata are stored in the Altinn 3 store while Altinn 2 just calls Altinn 3. (5) Receipts are no longer stored in Altinn 2; a pseudo receipt with receiptId 0 is generated from Altinn 3 metadata, so the Altinn 2 Receipt endpoint can no longer be used for Broker. (6) Use of the Manifest file in submitted file data is deprecated in Altinn 3, but Manifest-file functionality can be enabled in the transition solution."
      grounding: sources-and-answer
      tags:
        - altinn-broker
        - hard
        - list
        - lookup
      origin:
        source: new
        dataset: public-docs
