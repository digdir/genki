      input: What HTTP response codes can the Altinn Events 'GET /events' query API return, and what does each mean?
      expected:
        sources:
          - chunkId: ddd9d7bf9e6d
            document: ef28a8b441dc
            position: 1
        answerPattern: (?i)200|400|401|403
        referenceAnswer: 'The Altinn Events GET /events query API can return four response codes: 200 OK – events matching the query set are returned; 400 Bad Request – an invalid set of query parameters (refer to the problem details in the response body for more information); 401 Unauthorized – a missing, invalid or expired authorization header; and 403 Forbidden – missing the required scope for subscribing to events.'
