    - id: wg-studio-13-multipage-group
      split: validation
      input: How do I split the fill-out of a repeating group over multiple pages in an Altinn app?
      expected:
        sources:
          - chunkId: 528fad885093
            document: fbf13fbb8400
            position: 0
        answerPattern: (?i)children|prefix|0:|1:|multiPage|edit|repeating
        referenceAnswer: 'To split a repeating group''s fill-out over multiple pages, prefix each component in the children list with a number indicating which page it appears on, followed by a colon. The count starts at 0, so components on the first page are prefixed 0:, the second page 1:, and so on. In addition you must set "multiPage": true in the edit parameter. This functionality is only available for repeating groups and only for top-level groups (not nested groups); navigation happens within the layout and updates only the display inside the group''s editing area. A mode such as hideTable can also be set to hide the table while editing.'
      grounding: sources-and-answer
      tags:
        - altinn-studio
        - compound
        - extraction
      origin:
        source: new
        dataset: public-docs
