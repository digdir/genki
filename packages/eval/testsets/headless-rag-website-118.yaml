    - id: wg-corr-04-a2-a3-differences
      split: train
      input: What are the main differences between Altinn 2 and Altinn 3 Correspondence in terms of the data model, attachments, mass sending, notifications, and the authorization model?
      expected:
        sources:
          - chunkId: c185cf828273
            document: 62e4a838928d
            position: 1
        answerPattern: (?i)messagesummary|plain text|replyoptions|messagebody|markdown|attachments|shared|mass sending|200|notification templates|asynchronous|dialogporten|authorization|read|archiving
        referenceAnswer: "Key differences between Altinn 2 and Altinn 3 Correspondence: the data model is largely the same to enable mapping/migration, but the MessageSummary field now supports only plain text (no HTML), ReplyOptions are simplified to URL + descriptive text, and MessageBody must now be in Markdown (HTML no longer supported). Attachments are uploaded streamed in a separate step before creating the correspondence and can be shared across multiple messages. The API supports mass sending using templates/keywords and recipient lists plus shared attachments, allowing one request with a list of recipients to create up to 200 correspondences. Notification templates are greatly simplified to a predefined set representing majority use (with one highly customizable one); advanced needs should integrate directly with Altinn-Notifications. The process is more asynchronous and publishes Altinn-Events at important process steps so systems don't need to poll. All correspondences are created in Dialogporten and thus available to Arbeidsflate and other integrating systems automatically. The authorization model is simplified: the right to be a sender can be set in the policy for the Write action (no longer limited to the service owner), and recipient rights are simplified from Altinn 2's Read/Write/ArchiveRead/ArchiveDelete to only Read. Archiving is not currently supported; the closest equivalent is the SystemLabel archive in Dialogporten/Arbeidsflate."
      grounding: sources-and-answer
      tags:
        - altinn-correspondence
        - hard
        - list
        - lookup
      origin:
        source: new
        dataset: public-docs
