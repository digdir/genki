        referenceAnswer: For å legge til handlinger på en oppgave endrer du filen App/config/process/process.bpmn og legger til ønskede handlinger inne i en altinn:actions-blokk under altinn:taskExtension i oppgaven (f.eks. <altinn:action>demo</altinn:action> og <altinn:action type="processAction">custom</altinn:action>). type-attributtet processAction er standardverdien, så en handling uten oppgitt type er også processAction. I tillegg må brukerne gis rettigheter til å utføre handlingene, noe som defineres i policy.xml med en XACML-regel (Rule med Effect="Permit") som matcher rolle, org, app, task og action-id.
