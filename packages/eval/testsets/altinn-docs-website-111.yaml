      expected:
        answerPattern: (?i)5 minutes|7 days|reminder|9:00|5:00
        referenceAnswer: "A notification is sent 5 minutes after the message's publication time (or 5 minutes after the current time if the publication time is in the past). If a reminder is activated, it is sent after 7 days if the message has not been read (in the test and staging environments the reminder is currently sent after 1 day). Notifications can be sent via email or SMS: email has no time window, but SMS notifications are only sent between 9:00 AM and 5:00 PM — if the send time falls outside that window, the SMS is sent the following day."
