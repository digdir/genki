    - id: wg-notif-01-ordrestatus-verdier
      split: validation
      input: Hvilke statusverdier kan en varslingsordre (OrderProcessingState) ha i Altinn Notifications, og hva betyr hver av dem?
      tags:
        - altinn-notifications
        - hard
        - list
        - lookup
      origin:
        source: new
        dataset: public-docs
        legacyChunk: ead03d35367d
      expected:
        answerPattern: (?i)Registered|Processing|Processed|Completed|SendConditionNotMet|Cancelled
        referenceAnswer:
          'En varslingsordre i Altinn Notifications kan ha seks OrderProcessingState-verdier (API-statusstreng i parentes):

          1. Registered (Order_Registered) – ordren er opprettet og lagret, men behandlingen har ikke startet ennå (midlertidig).

          2. Processing (Order_Processing) – ordren behandles nå (mottakeroppslag, evaluering av sendebetingelser osv.) (midlertidig).

          3. Processed (Order_Processed) – ordren er ferdig behandlet og overlevert til e-post- og SMS-kanalene (midlertidig).

          4. Completed (Order_Completed) – ordren er ferdig behandlet, og alle varsler har fått endelig leveringsstatus (endelig).

          5. SendConditionNotMet (Order_SendConditionNotMet) – sendebetingelsen var ikke oppfylt, derfor ble ingen varsler sendt (endelig).

          6. Cancelled (Order_Cancelled) – ordren ble kansellert før utsending (endelig).

          Forskjellen på Processed og Completed: Processed betyr at alle varsler er opprettet men at sluttstatus for leveringen fortsatt følges opp, mens Completed betyr at både ordren og alle tilhørende varsler har fått endelig leveringsstatus.'
        sources:
          - chunkId: e495755481b4
            document: 2801ab13e173
            position: 0
      grounding: sources-and-answer
