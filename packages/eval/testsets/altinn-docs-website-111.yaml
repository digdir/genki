        answerPattern: (?i)small|reusability|dry|comments|capital|data-loading|feature-based|linting
        referenceAnswer: 'The app frontend tries to follow these React architecture best-practices: small, function-specific components (UI components are "dumb", keeping logic to a minimum); reusability (UI components shared across apps and between app frontend and receipt frontend, using Material UI components as much as possible instead of building custom ones); DRY code (shared resources/utils across features and between app frontend and receipt frontend to avoid duplication); comments only where necessary (self-explanatory function and component names, avoiding clutter); component names in capital; keeping complex data-loading logic separate from rendering of components (state handled by redux, data passed as props to UI components where possible); using a feature-based code structure (grouping code by feature rather than by function); and following linting rules (using a code analyzer for clean, readable code).'
