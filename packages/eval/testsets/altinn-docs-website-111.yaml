        - altinn-studio
        - extraction
        - hard
      origin:
        source: new
        dataset: public-docs
        legacyChunk: 5b296af8dff1
      expected:
        answerPattern: (?i)AddHttpClient|RegisterCustomAppServices|ProcessDataWrite|DataProcessingHandler|App\.cs|ProcessDataRead
        referenceAnswer: Register the client in App/Program.cs (.NET 6) or App/Startup.cs (.NET 5) inside RegisterCustomAppServices using services.AddHttpClient<ICountryClient, CountryClient>(), and add the relevant using statements. Then make the client available in DataProcessingHandler.cs by creating a constructor, adding a private field, and injecting the client (e.g. ICountryClient) into the constructor. Use the client in the ProcessDataWrite method to enrich the form data. Because DataProcessingHandler is instantiated in App.cs, you must inject the dependency (e.g. ICountryClient) as the last parameter of the App.cs constructor and pass it into the new DataProcessingHandler(...). Note that stateless apps do not call ProcessDataWrite - use ProcessDataRead instead. Responses can be cached (e.g. with IMemoryCache and a 24-hour expiration) in the client to avoid repeated API calls.
        sources:
          - chunkId: cdb69ef52625
            document: f112c1bfe0f2
            position: 4
          - chunkId: ffab464a29f1
            document: f112c1bfe0f2
