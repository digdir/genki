    - id: wg-dialog-08-write-actions-constraints
      split: holdout
      input: In Dialogporten, what operations are browser-based GUI actions constrained to by default, and why can't they perform a cross-origin POST?
      tags:
        - altinn-dialogporten
        - compound
        - list
        - lookup
      origin:
        source: new
        dataset: public-docs
        legacyChunk: 06ee7c6dee63
      expected:
        answerPattern: (?i)read operations|http get|cross-origin|post|csrf|cross-site request forgery|sso
        referenceAnswer: Browser-based end-user systems implementing GUI actions are by default constrained to read operations, i.e. navigating to a page or downloading a file, using HTTP GET methods. While cross-origin full-page navigation is not constrained by browsers (enabling SSO and session initialization via redirects), performing a cross-origin POST (submitting a form to an endpoint on a different server) while relying on the same SSO and session initialization mechanisms is not possible in modern browsers or in ID-porten. This is by design, to avoid security issues stemming from cross-site request forgery (CSRF). Custom end-user systems using API actions and Maskinporten or system-user authentication are not constrained by this, since these are browser security measures and not inherent HTTP limitations.
        sources:
          - chunkId: ce6df51825e6
            document: 1102630d93d8
            position: 0
      grounding: sources-and-answer
