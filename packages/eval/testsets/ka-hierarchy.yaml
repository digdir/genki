  cases:
    - id: kah-under-dfd
      split: validation
      type: criteria
      grounding: answer-only
      input: Hvilke virksomheter ligger under Digitaliserings- og forvaltningsdepartementet?
      expected:
        criteria:
          criteria: 'Per 2026-11-17 ligger disse direkte under Digitaliserings- og forvaltningsdepartementet: Datatilsynet, Departementenes digitaliseringsorganisasjon, Departementenes sikkerhets- og serviceorganisasjon, Digitaliseringsdirektoratet, Nasjonal kommunikasjonsmyndighet, Statsbygg og Statsforvalterens fellestjenester, og de ti statsforvalterembetene. Svaret nevner alle disse; statsforvalterne kan nevnes samlet som Statsforvalteren. Svaret sier ikke at Direktoratet for forvaltning og økonomistyring (DFØ), Norges forskningsråd eller Statens pensjonskasse ligger under departementet; de ligger under Finansdepartementet, Kunnskapsdepartementet og Arbeids- og inkluderingsdepartementet.'
      tags:
        - ministry-to-agencies
        - correctness
        - trap
        - register-2026-11-17
    - id: kah-under-fin
      split: validation
      type: criteria
      grounding: answer-only
      input: Hvilke virksomheter ligger under Finansdepartementet?
