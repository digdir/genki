        criteria:
          criteria: 'Per 2026-11-17 ligger disse direkte under Finansdepartementet: Direktoratet for forvaltning og økonomistyring, Finanstilsynet, Skatteetaten, Statistisk sentralbyrå og Tolletaten. Svaret nevner alle disse og ingen virksomhet som ikke ligger under departementet.'
      tags:
        - ministry-to-agencies
        - correctness
        - register-2026-11-17
