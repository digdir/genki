  cases:
    - id: ue-broker-01-filoverforing-tilstander
      split: validation
      input: Hvilke statuser kan en filoverføring i Altinn Formidling gå gjennom, fra den blir startet til filen er slettet?
      expected:
        sources:
          - chunkId: 218bee00be34
            document: d56b73485fd6
            position: 3
        answerPattern: (?i)initialisert|opplasting|publisert|bekreftet nedlastet
        referenceAnswer: 'En filoverføring i Altinn Formidling går gjennom tilstandene i en endelig tilstandsmaskin: Initialisert → Opplasting pågår → Sjekk av opplasting → Publisert → Nedlastinger initiert → Alle bekreftet nedlastet → Slettet. I tillegg finnes to slutt-/feiltilstander: Avbrutt (bare mulig så lenge ingen nedlasting har startet) og Overføring feilet.'
      grounding: sources-and-answer
      tags:
        - altinn-broker
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-broker-02-slette-tid-tilgjengelig
      split: train
      input: How long does a file stay available for download in Altinn Broker, and how do I control when it gets deleted after recipients confirm?
      expected:
        sources:
          - chunkId: 0127378417da
            document: 479e27df943e
            position: 0
        answerPattern: (?i)FileTransferTimeToLive|PurgeFileTransferAfterAllRecipientsConfirmed|PurgeFileTransferGracePeriod|30 days
        referenceAnswer: In Altinn Broker the sender controls availability via `FileTransferTimeToLive` (default 30 days, maximum 1 year). To have the file deleted once all required recipients have confirmed download, set `PurgeFileTransferAfterAllRecipientsConfirmed = true`; the `PurgeFileTransferGracePeriod` then controls how long the file stays available after confirmation before deletion (default 2 hours, maximum 24 hours).
      grounding: sources-and-answer
      tags:
        - altinn-broker
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-broker-03-store-filer-virusskann
      split: train
      input: Can I send files larger than 2GB through Altinn Broker, and what is the maximum file size?
      expected:
        sources:
          - chunkId: 462659d19025
            document: f9c39f17a534
            position: 0
        answerPattern: (?i)2\s?GB|virus scan|1\.6\s?TB|pre-approved
        referenceAnswer: 'Yes, but conditionally: Broker is restricted to 2 GB by default because of the virus scan, and you can send larger files only if the resource has virus scanning disabled (which requires pre-approval from Altinn). The theoretical maximum size is 1.6 TB (regularly benchmarked to 100 GB); equivalently the product supports up to ~1600 GB without virus scanning and up to 2 GB with it.'
      grounding: sources-and-answer
      tags:
        - altinn-broker
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-broker-04-overgang-a2-a3-forskjeller
      split: train
      input: What changes for consumers when an Altinn 2 Broker service is moved to Altinn 3, for example around receipts and virus scanning?
      expected:
        sources:
          - chunkId: 7c0cab211f48
            document: e960d2f402e0
            position: 5
        answerPattern: (?i)Receipt Id|virus.?scan|after upload|File List
        referenceAnswer: 'For end users there is little technical difference between an Altinn 2 Broker service and one transitioned to Altinn 3, but consumers should review the docs for required code changes. Functionally, receipts will no longer have a Receipt Id, and (if enabled) manifest files will no longer have a File List. Virus scanning also changes: in Altinn 3 it is done after upload, so an uploaded file is not immediately available and only becomes available once the automatic virus scan completes. Getting receipts via the external Receipt SOAP endpoint is not supported.'
      grounding: sources-and-answer
      tags:
        - altinn-broker
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-broker-05-filstorrelse-grenser-multi
      split: train
      input: Hva er filstørrelsesgrensene i Altinn Broker med og uten virusskanning, hvorfor er standardgrensen 2 GB, og hva må til for å sende større filer?
      expected:
        sources:
          - chunkId: 0127378417da
            document: 479e27df943e
            position: 0
          - chunkId: 462659d19025
            document: f9c39f17a534
            position: 0
        answerPattern: (?i)2\s?GB|virus|1[.,]?6\s?TB|1600\s?GB|pre-approved|forh[åa]ndsgodkjen
        referenceAnswer: I Altinn Broker er standardgrensen 2 GB med virusskanning, og denne grensen skyldes nettopp begrensninger i virusskanningen. Uten virusskanning støttes langt større filer — opptil ca. 1600 GB (1,6 TB er den teoretiske maksgrensen, men det benchmarkes jevnlig bare til 100 GB). For å sende filer større enn 2 GB må ressursen ha virusskanning deaktivert, og slike ressurser må forhåndsgodkjennes av Altinn (Digdir).
      grounding: sources-and-answer
      tags:
        - altinn-broker
        - compound
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-events-01-abonnement-filtre
      split: holdout
      input: Når jeg oppretter et abonnement i Altinn Events, hvilke filtre kan jeg sette og hvorfor får jeg ingen hendelser hvis jeg setter typeFilter til en tom streng?
      expected:
        sources:
          - chunkId: a7d7ed7a67e4
            document: 99b415acaa9e
            position: 1
          - chunkId: 4aa2b0740446
            document: 23a9d95b4a7b
            position: 1
        answerPattern: (?i)resourceFilter|subjectFilter|typeFilter|tom streng
        referenceAnswer: Når du oppretter et abonnement i Altinn Events kan du sette `resourceFilter` (påkrevd; eksakt treff på ressursen, f.eks. `urn:altinn:resource:app_digdir_demoapp`, kan autofylles fra `source` for en gyldig Altinn Studio App-URL), `subjectFilter` (påkrevd med mindre du er tjenesteeier; eksakt treff på cloud-event-subjektet), samt valgfrie `sourceFilter`, `alternativeSubjectFilter` og `typeFilter`. Filtrene gjør et eksakt treff, så hvis du setter `typeFilter` til en tom streng matcher den ingen hendelsestype og du mottar ingen hendelser — utelat filteret hvis du ikke vil begrense på type.
      grounding: sources-and-answer
      tags:
        - altinn-events
        - hard
      origin:
        source: new
        dataset: public-docs
      needsReview: true
    - id: ue-events-02-publisere-cloudevents
      split: train
      input: Hvordan publiserer jeg en egendefinert hendelse til Altinn Events, og hvilket Maskinporten-scope og format trengs?
      expected:
        sources:
          - chunkId: 5ea03a5c4cbb
            document: 771a2f1ad237
            position: 1
        answerPattern: (?i)POST /events|altinn:events\.publish|cloudevents|Ressursregister
        referenceAnswer: Du publiserer en egendefinert (generisk) hendelse med `POST /events`, med innholdstype `application/cloudevents+json` og en Cloud Event serialisert som en JSON-streng i request body. API-et krever autentisering og Maskinporten-scopet `altinn:events.publish`. Cloud Event-en må ha id, type, source (URI) og en `resource` i formatet `urn:altinn:resource:[prop1].[prop2]`, og ressursen må være registrert i Altinn Ressursregister før hendelsen publiseres.
      grounding: sources-and-answer
      tags:
        - altinn-events
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-events-03-polling-vs-webhook
      split: validation
      input: Kan jeg hente hendelser fra Altinn Events ved å polle et API i stedet for å bruke webhooks?
      expected:
        sources:
          - chunkId: bd4ef5587250
            document: ae894f1e7b46
            position: 0
        answerPattern: (?i)polling|Events API|webhooks|planlagte forespørsler
        referenceAnswer: Ja — Events API tilbyr et HTTP API for planlagte forespørsler (querying) av de samme hendelsesdataene, så du kan hente hendelser ved å polle i stedet for å bruke webhooks. Men Altinn Events er designet spesifikt for å unngå polling, og webhooks/abonnement er den anbefalte måten å motta hendelser på; poll-API-et er først og fremst ment for å støtte gradvise, inkrementelle arkitekturmigrasjoner.
      grounding: sources-and-answer
      tags:
        - altinn-events
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-studio-01-skjul-felt-uttrykk
      split: holdout
      input: Hvordan setter jeg opp en regel i Altinn Studio som skjuler «Send inn»-knappen når aldersfeltet er tomt eller under 18?
      expected:
        sources:
          - chunkId: 5579a6f92633
            document: 567750d54810
            position: 3
        answerPattern: (?i)logikkregel|underuttrykk|operand|skjul felt|mindre enn
        referenceAnswer: 'I Altinn Studio lager du en logikkregel på «Send inn»-knappen og velger «Skjul felt dersom». Du bygger uttrykket med underuttrykk: ett underuttrykk der Første operand er datamodellfeltet `alder`, Operator er «er mindre enn» og Andre operand er tallet 18, og et annet underuttrykk som sjekker om feltet er tomt, koblet sammen med ELLER slik at knappen skjules hvis enten feltet er tomt eller verdien er under 18. Lagre underuttrykkene; knappen skjules når uttrykket evalueres til sant.'
      grounding: sources-and-answer
      tags:
        - altinn-studio
        - hard
      origin:
        source: new
        dataset: public-docs
      needsReview: true
    - id: ue-studio-02-pdf-service-task
      split: holdout
      input: How do I add a step that generates a PDF in my app's process in Altinn Studio?
      expected:
        sources:
          - chunkId: 673de6e9a85d
            document: eacad0b6a864
            position: 1
        answerPattern: (?i)Arbeidsflyt|PDF service task|process\.bpmn|autoPdfTaskIds|layout set
        referenceAnswer: In Altinn Studio, open the Arbeidsflyt (process) tab and drag-and-drop a PDF service task into the process where you want the PDF generated (often right after a data task). A configuration panel then opens where you choose between a standard PDF (based on selected previous tasks, shown in summary mode — this does not respect the `pdfLayoutName` configuration in Settings.json) or a custom PDF. Altinn Studio inserts a `serviceTask` (id `Pdf`, name `PDF`) into `App/config/process/process.bpmn`.
      grounding: sources-and-answer
      tags:
        - altinn-studio
        - hard
      origin:
        source: new
        dataset: public-docs
      needsReview: true
    - id: ue-studio-03-datamodell-filer
      split: train
      input: Hvilke modellfiler genereres for en app-datamodell og hvor i repoet ligger de?
      expected:
        sources:
          - chunkId: 3db5a48a99cd
            document: 87044ee89679
            position: 1
        answerPattern: (?i)App/models|schema\.json|metadata\.json|\.cs|XSD
        referenceAnswer: 'En app-datamodell har fire modellfiler, lagret i repoet under `App/models`: C#-datamodellen (`<model>.cs`, brukt av backend/API-er), JSON schema (`<model>.schema.json`, brukt på frontend for fortløpende validering og i datamodelleringsverktøyet), XSD (`<model>.XSD`, XML-format som kan lastes opp/ned for å generere de andre filene), og JSON-metadata (`<model>.metadata.json`, brukt av Altinn Studio for å generere `.cs`-filen; lagres ikke i appen og genereres ved behov).'
      grounding: sources-and-answer
      tags:
        - altinn-studio
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-studio-04-non-repeating-group
      split: train
      input: How do I group several fields together in a form so I can apply the same dynamics to all of them at once?
      expected:
        sources:
          - chunkId: f363a6c2c64f
            document: 64bac155236b
            position: 0
        answerPattern: (?i)FormLayout\.json|Group|children|group component
        referenceAnswer: Group several fields by adding a Group component in `FormLayout.json` with `type` `Group` and a `children` array listing the component IDs you want together. Once grouped, you can apply the same dynamics to all of them at once instead of configuring each field individually. You can do this manually in the file or via the group component in the Altinn Studio form editor.
      grounding: sources-and-answer
      tags:
        - altinn-studio
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-studio-05-tekstressurser-sprak
      split: holdout
      input: Hvordan legger jeg til og oversetter tekster til flere språk i appen min i Altinn Studio?
      expected:
        sources:
          - chunkId: e843f5ba3968
            document: 98fbadea81d9
            position: 3
        answerPattern: (?i)Teksteditor|tekstn[øo]kkel|Ny tekst|spr[åa]k|oversett
        referenceAnswer: Du redigerer og oversetter tekster i Altinn Studio enten via Altinn Studio Designer eller direkte i repository. I Designer går du til Tekst i toppmenyen for å se og redigere tekstressurser; «Ny tekst» oppretter en ressurs med en automatisk generert tekstnøkkel (kan endres med blyant-ikonet), og endringer lagres automatisk. I panelet til høyre velger du hvilke språk som vises i tabellen og legger til nye språk appen skal oversettes til. Du kan også legge til/redigere/oversette tekster for en enkelt komponent direkte fra skjemaeditoren («Lage»-fanen).
      grounding: sources-and-answer
      tags:
        - altinn-studio
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-studio-06-options-kilder-kodeliste
      split: train
      input: Hvilke egenskaper kan jeg bruke for å koble en komponent til svaralternativer/kodelister, og hvilken vinner hvis flere er satt?
      expected:
        sources:
          - chunkId: ad0da73c1f75
            document: fe85e115aa05
            position: 0
        answerPattern: (?i)options|optionsId|source|forrang|svaralternativ
        referenceAnswer: 'Du kobler en komponent til svaralternativer/kodelister med én av tre egenskaper: `options` (statiske svaralternativer definert per komponent), `optionsId` (statiske kodelister fra JSON-filer, dynamiske kodelister eller delte kodelister), eller `source` (kodelister fra datamodellen). Minst én må settes; hvis flere er satt er prioriteten motsatt av rekkefølgen over, slik at `source` har forrang over `optionsId`, som har forrang over `options`.'
      grounding: sources-and-answer
      tags:
        - altinn-studio
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-studio-07-validering-uttrykk-fil
      split: validation
      input: Hvordan setter jeg opp egendefinert validering med uttrykk når det ikke kan gjøres i Studio Designer?
      expected:
        sources:
          - chunkId: 59fc6201428d
            document: 221250e04c48
            position: 1
        answerPattern: (?i)validation\.json|validations|definitions|uttrykk|datamodell
        referenceAnswer: Validering med uttrykk kan foreløpig ikke konfigureres i Altinn Studio Designer, så du oppretter en egen fil ved siden av datamodellen med navnekonvensjonen `navn.validation.json` (f.eks. `skjema.validation.json` hvis datamodellen heter `skjema`), med `$schema`, `validations` og `definitions`. Reglene legges i `validations`-objektet der datamodell-stien (samme format som `dataModelBindings`) er nøkkelen og verdien er en liste med regler; hver regel har `message`, `severity` og en `condition` som er et dynamisk uttrykk som returnerer sant når feilen skal vises. Gjenbrukbare regler kan defineres under `definitions`.
      grounding: sources-and-answer
      tags:
        - altinn-studio
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-corr-01-events-webhook-subscription
      split: holdout
      input: Hvordan setter jeg opp et webhook-abonnement for å motta hendelser fra Altinn Correspondence, og hvilke filtre må jeg bruke som mottaker?
      expected:
        sources:
          - chunkId: f8eabe6d3ce3
            document: 7a010952d7b4
            position: 0
        answerPattern: (?i)resourceFilter|subjectFilter|subscription|correspondencepublished
        referenceAnswer: 'To receive events/webhooks from Altinn Correspondence you must set up a subscription for the resource, which configures the endpoint the events are delivered to. As a recipient you are required to set two filters: `resourceFilter` = `urn:altinn:resource:` + the Resource Id of the Correspondence resource, and `subjectFilter` = `urn:altinn:organization:identifier-no:{recipient orgnumber}`. Events follow the CloudEvent pattern (e.g. type `no.altinn.correspondence.correspondencepublished`).'
      grounding: sources-and-answer
      tags:
        - altinn-correspondence
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-corr-02-transmission-group-dialog
      split: validation
      input: Hvordan kan jeg knytte en ny melding til en eksisterende dialog slik at relaterte instanser grupperes sammen?
      expected:
        sources:
          - chunkId: 2f623a3a1547
            document: eaa7903e19e2
            position: 1
        answerPattern: (?i)transmission|dialogId|externalReferences|DialogportenDialogId
        referenceAnswer: Du knytter den nye meldingen til en eksisterende dialog ved å legge inn en ekstern referanse i `externalReferences` der `referenceValue` settes til `dialogId` for dialogen og `referenceType` settes til `DialogportenDialogId`; da grupperes relaterte instanser i samme dialog (transmission). Du kan eventuelt sette transmission-type med en egen ekstern referanse av `referenceType` `DialogportenTransmissionType` (verdi som `Information` eller `1`); hvis den ikke settes, er typen Information (1).
      grounding: sources-and-answer
      tags:
        - altinn-correspondence
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-corr-03-system-til-system-nedlasting
      split: validation
      input: Vi mottar store mengder meldinger med vedlegg i Altinn - bør vi behandle dem manuelt i innboksen eller integrere mot API?
      expected:
        sources:
          - chunkId: 939545886fa9
            document: d8ceec8ede98
            position: 1
        answerPattern: (?i)system-til-system|integra|vedlegg|maskinelt|Dialogporten
        referenceAnswer: For store volumer av meldinger med vedlegg bør dere integrere mot API (system-til-system) i stedet for å behandle dem manuelt i innboksen — GUI-innboksen er primært egnet for manuell behandling i mindre skala, mens effektiv håndtering av større mengder forutsetter integrasjon. Ved å integrere sak-/arkivsystemet mot Altinn via Dialogporten og tilhørende API-er kan dere automatisk oppdage og hente nye meldinger, laste ned meldinger og vedlegg maskinelt, og journalføre/arkivere direkte i eget fagsystem.
      grounding: sources-and-answer
      tags:
        - altinn-correspondence
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-corr-04-notification-order-sms-window
      split: validation
      input: When a correspondence message triggers an SMS notification, at what time of day is the SMS actually sent, and when is a reminder sent if it stays unread?
      expected:
        sources:
          - chunkId: 0af9eaceae9e
            document: a960f8906327
            position: 0
        answerPattern: (?i)9:00 AM|5:00 PM|reminder|7 days|notification order
        referenceAnswer: An SMS notification is only sent within the SMS window of 09:00–17:00 (9 AM–5 PM); if the send time falls outside that window it is sent the following day (email has no time window). If a reminder is enabled and the message stays unread, the reminder is sent after 7 days in production — but after 1 day in the test/staging environment.
      grounding: sources-and-answer
      tags:
        - altinn-correspondence
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-notif-05-umiddelbar-varsling-otp
      split: train
      input: Vi trenger å sende en engangskode (OTP) til brukeren med en gang ved innlogging - finnes det en måte å sende et varsel øyeblikkelig på, døgnet rundt?
      expected:
        sources:
          - chunkId: 046877b17d91
            document: 5e8f2f62095c
            position: 1
        answerPattern: (?i)umiddelbar varsling|OTP|sendingTimePolicy|Anytime|shipmentId
        referenceAnswer: 'Ja — bruk Umiddelbar varsling i Altinn Varsling, som sender meldinger øyeblikkelig til én mottaker (e-postadresse eller telefonnummer) og er laget nettopp for tidskritiske ting som en engangskode (OTP) ved innlogging. For å sende så raskt som mulig hele døgnet kan du utelate `requestedSendTime` og bruke `sendingTimePolicy` satt til `Anytime`. Tjenesten er semisynkron: API-et returnerer `201 Created` eller `200 OK` med `shipmentId` og `notificationOrderId`, mens leveringsstatus hentes asynkront (responskoden bekrefter bare at bestillingen ble registrert, ikke at leveringen lyktes).'
      grounding: sources-and-answer
      tags:
        - altinn-notifications
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-notif-06-egendefinert-avsender-epost-dns
      split: holdout
      input: Hvordan kan jeg sette en egen e-postadresse som avsender på varsler via API-et, og hva må til for å ta i bruk et eget domene?
      expected:
        sources:
          - chunkId: aa73725749c0
            document: 286593dbb706
            position: 3
        answerPattern: (?i)senderEmailAddress|emailSettings|DNS|DKIM|verifiser
        referenceAnswer: 'Du setter en egen e-postavsender ved å inkludere feltet `senderEmailAddress` i `emailSettings`-objektet i API-kallet når du bestiller varsler. For å ta i bruk et eget domene som avsenderadresse må domenet først gjennom en registrerings- og verifiseringsprosess: (1) tjenesteeier ber om registrering av domene/avsender, (2) Digdir registrerer domenet og utsteder verifiseringsnøkler, (3) tjenesteeier legger til DNS-poster (TXT, SPF, DKIM, DMARC), (4) Digdir verifiserer DNS-postene og kobler domenet, og (5) tjenesteeier kan bruke domenet i API-kall.'
      grounding: sources-and-answer
      tags:
        - altinn-notifications
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-notif-07-standard-avsender-sms-epost
      split: holdout
      input: Hvis jeg ikke konfigurerer noe eget, hvilken avsender vises på SMS og e-post som sendes gjennom Altinn Varsling?
      expected:
        sources:
          - chunkId: 1ae507a826c4
            document: 286593dbb706
            position: 0
        answerPattern: (?i)Altinn|noreply@altinn|avsender|SMS|epost
        referenceAnswer: Uten egen konfigurasjon er standardavsenderen på SMS «Altinn» («Altinn-test» i testmiljøet), og på e-post `noreply@altinn` (`noreply-tt02@altinn.no` i testmiljøet og `noreply@altinn.cloud` i ytelsestestmiljøet).
      grounding: sources-and-answer
      tags:
        - altinn-notifications
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-dialog-01-aktivitetslogg
      split: train
      input: Hva er aktivitetsloggen til en dialog i Dialogporten, og hvem fyller den ut?
      expected:
        sources:
          - chunkId: 58d02570ed96
            document: fd39a68c8de7
            position: 0
        answerPattern: (?i)aktivitetslogg|uforanderlig|tjenesteeier|tidsstemplede
        referenceAnswer: Aktivitetsloggen i Dialogporten er en uforanderlig liste over tidsstemplede oppføringer som viser historikken gjennom en dialogs levetid, der hver oppføring er av en bestemt type (f.eks. opprettelse av dialogen, en melding fra tjenesteeier, innsendt data, en signatur eller betaling, eller at en forsendelse åpnes). Tjenesteeieren er ansvarlig for å fylle den ut, normalt i forbindelse med andre endringer i dialogen.
      grounding: sources-and-answer
      tags:
        - altinn-dialogporten
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-dialog-02-seen-log
      split: validation
      input: In Dialogporten, what exactly does it mean that a dialog has been 'seen' in the seen log, and does listing or searching dialogs count?
      expected:
        sources:
          - chunkId: bf583073feb1
            document: 7d5b35931f86
            position: 0
        answerPattern: (?i)seen log|requested from the API|search or list|automatically
        referenceAnswer: In Dialogporten a dialog is 'seen' when a particular dialog ID has been requested from the API — the seen log is populated automatically and records who accessed a dialog at a given revision. It does not indicate whether the content was read or understood, attachments were downloaded, or actions were performed. Using the search or list API does not populate the seen log; entries are recorded per user per revision (only the first access by a given user for a given revision).
