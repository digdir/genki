        referenceAnswer: Forskjellen er hvem som initierer opprettelsen og hvordan godkjenningen skjer. Ved brukerstyrt (sluttbrukerstyrt) opprettelse logger sluttbrukeren selv inn i Altinn, velger hvilket system systembrukeren skal opprettes for, og godkjenner de forhåndsdefinerte tilgangene systemet krever — systembrukeren opprettes da direkte uten at det genereres en separat forespørsel. Ved leverandørstyrt opprettelse er det sluttbrukersystem-leverandøren (SBSL) som sender en forespørsel til Altinn om å opprette systembrukeren, og sluttbrukeren må deretter godkjenne forespørselen i Altinn før systembrukeren opprettes.
