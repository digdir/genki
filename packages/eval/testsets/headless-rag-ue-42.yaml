        referenceAnswer: Den sentrale verdien er `authorization_details[].systemuser_id` i systembrukertokenet — den unike ID-en for systembrukeren, og det er denne Altinn trenger for å autorisere tilgang (det er systembrukeren som har fått delegert tilgangene). Tokenet valideres som et standard Maskinporten-token, men inneholder i tillegg `authorization_details` med `type` `urn:altinn:systemuser` (samt `systemuser_org.id` for organisasjonen som opprettet systembrukeren). Tjenesteeier bruker `systemuser_id` som AccessSubject i kallet mot Altinn Autorisasjon (PDP) for å få et Permit/Deny-svar på tilgangen.
