    - id: ue-authz-05-xacml-policy-regelstruktur
      split: train
      input: What does a XACML policy in Altinn describe, and what are the parts that make up each rule?
      expected:
        sources:
          - chunkId: c28fc018e0d0
            document: 9ed057e7daaa
            position: 1
        answerPattern: (?i)XACML|resource.*action.*subject|rule|access rules
        referenceAnswer: 'A XACML policy in Altinn describes the access rules for an app created in Altinn Studio, a resource in the Altinn Resource Registry, or a correspondence/broker service in Altinn 3 (following the XACML 3.0 standard with a limited feature set). A policy consists of 1-to-many rules, and each rule has three parts: Resource (what the rule applies to), Action (e.g. read, write, sign), and Subject (who it applies to — a role, access group, organization number, or user). A rule can combine multiple resources, actions, and subjects.'
      grounding: sources-and-answer
      tags:
        - altinn-authorization
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-authz-06-xacml-obligation-authlevel
      split: holdout
      input: How do I set the required authentication level for access in the XACML policy, and what is the default?
      expected:
        sources:
          - chunkId: e246b621f86c
            document: 0453a21f0b21
            position: 4
        answerPattern: (?i)obligation|authentication ?level|minimum-authenticationlevel|Maskinporten
        referenceAnswer: You set the required authentication level as an Obligation in the XACML policy file, using an `ObligationExpression` with an `AttributeAssignmentExpression` for the category `urn:altinn:minimum-authenticationlevel` and an integer value. The default required authentication level is 2. If you set it to 4, you must also allow the service owner to interact through level-3 authentication, because Maskinporten is defined as level 3.
      grounding: sources-and-answer
      tags:
        - altinn-authorization
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-authz-07-bruker-typer-authorization
      split: validation
      input: What are the different types of users Altinn Authorization supports, and which ones can actually submit on behalf of a party in an app?
      expected:
        sources:
          - chunkId: 8d82f06ea710
            document: 8f46ae005cbe
            position: 1
        answerPattern: (?i)system ?user|service owner|organization|valid submitter|Maskinporten token
        referenceAnswer: 'Altinn Authorization supports four user types: Users, Organization, Service owner, and System user. Of these, Users (who can represent other parties through party selection) and System users (which impersonate the system user with rights delegated from the customer) can effectively act/submit on behalf of a party in an app. Organizations are not valid submitters (an organization cannot submit on behalf of itself), and Service owners are also not valid submitters, though depending on the XACML policy they can start new instances and modify data in existing ones.'
      grounding: sources-and-answer
      tags:
        - altinn-authorization
        - hard
      origin:
        source: new
        dataset: public-docs
    - id: ue-sys-01-leverandorstyrt-og-forhold
