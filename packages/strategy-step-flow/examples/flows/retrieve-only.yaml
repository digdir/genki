# headless-rag builtin/retrieve-only, expressed as a flow. The service runs rag-single-shot@1; this shows the same graph fits.
apiVersion: genai/v1
kind: StepFlow
metadata: { tenant: '991825827', id: retrieve-only, name: Retrieve Only }
spec:
  purpose: Retrieve and rerank evidence without generating an answer
  steps:
    - id: retrieve
      block: retrieve@1
      input: { query: '{{input.query}}', history: '{{input.history}}' }
    - id: rerank
      block: rerank@1
      input: { query: '{{input.query}}', chunks: '{{retrieve.chunks}}' }
    - id: answer
      block: answer@1
      input: { text: '', chunks: '{{rerank.contextChunks}}' }
