apiVersion: genai/v1
kind: Service
metadata: { tenant: '991825827', id: agent-rag-faithful, name: 'Agentisk søk, trinnvis' }
spec:
  purpose: 'Søk, les og svar med kilder'
  audience: [employees]
  riskClass: limited
  variants:
    - id: default
  input: { accepts: [text/plain] }
  output: { kind: answer, withSources: true }
  strategy:
    id: step-flow
    version: 1
    config: { 'flow': 'agent-rag@1', 'vars': { 'variant': 'faithful' } }
  knowledge:
    datasets:
      - dataset: digdir/kudos
    reranker: colbert
    retrieval: { maxPerDocument: 10 }
  model: { primary: foundry-openai/gpt-4o-2m-tps, residency: global }
  exposure: { mcp: true, openai: true, rest: true }
