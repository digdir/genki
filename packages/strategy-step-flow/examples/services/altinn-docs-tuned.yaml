apiVersion: genai/v1
kind: Service
metadata: { tenant: '991825827', id: altinn-docs-tuned, name: 'Altinn-dokumentasjon, tilpasset' }
spec:
  purpose: 'Agentisk søk med frasevekting tilpasset Altinn-dokumentasjonen'
  audience: [employees]
  riskClass: limited
  variants:
    - id: faithful
    - id: bundled
      overrides: { 'vars': { 'variant': 'bundled' } }
  input: { accepts: [text/plain] }
  output: { kind: answer, withSources: true }
  strategy:
    id: step-flow
    version: 1
    config: { 'flow': 'altinn-docs-tuned@1', 'vars': { 'variant': 'faithful' } }
  knowledge:
    datasets:
      - dataset: digdir/kudos
    reranker: colbert
    retrieval: { maxPerDocument: 10 }
  model: { primary: foundry-openai/gpt-4o-2m-tps, residency: global }
  exposure: { mcp: true, openai: true, rest: true }
