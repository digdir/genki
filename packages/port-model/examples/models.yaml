endpoints:
  foundry:
    baseURL: https://example.services.ai.azure.com
    auth: { kind: token-provider, provider: entra }
    families:
      openai: /openai/v1
      anthropic: /anthropic
  aivar:
    baseURL: https://aivar.example.no
    auth: { kind: bearer, secret: secret://aivar/key }
    families: { openai: /v1 }
models:
  - id: foundry/gpt-4o
    endpoint: foundry
    deployment: gpt-4o-prod
    residency: norway
    capabilities: [stream, tools, json-schema]
    apis: { chat: openai/responses@1 }
  - id: foundry/claude-opus
    endpoint: foundry
    deployment: claude-opus
    residency: global
    capabilities: [stream, tools, json-schema, reasoning]
    apis: { chat: anthropic/messages@1 }
    options: { defaultMaxTokens: 8192 }
  - id: aivar/borealis
    endpoint: aivar
    deployment: borealis
    residency: norway
    capabilities: [stream]
    options: { tokenParam: max_tokens }
