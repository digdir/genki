name: infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [test]
        default: test
      what-if:
        description: Only show what would change
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      PG_ADMIN_GROUP_OBJECT_ID: ${{ vars.PG_ADMIN_GROUP_OBJECT_ID }}
      PG_ADMIN_GROUP_NAME: ${{ vars.PG_ADMIN_GROUP_NAME }}
      DEPLOY_PRINCIPAL_ID: ${{ vars.DEPLOY_PRINCIPAL_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: current
        run: |
          app=$(az containerapp list -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query "[?ends_with(name, '-api')].name | [0]" -o tsv)
          if [ -n "$app" ]; then
            echo "image=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$app" --query 'properties.template.containers[0].image' -o tsv)" >> "$GITHUB_OUTPUT"
            echo "version=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$app" --query "properties.template.containers[0].env[?name=='APP_VERSION'].value | [0]" -o tsv)" >> "$GITHUB_OUTPUT"
          else
            echo "image=mcr.microsoft.com/k8se/quickstart:latest" >> "$GITHUB_OUTPUT"
            echo "version=bootstrap" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          az deployment group ${{ inputs.what-if && 'what-if' || 'create' }} \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "infra-${{ github.run_id }}" \
            --parameters infra/env/${{ inputs.environment }}.bicepparam \
            --parameters image="${{ steps.current.outputs.image }}" appVersion="${{ steps.current.outputs.version }}"
