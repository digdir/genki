[env]
_.python.venv = { path = "venv", create = true }
MARKER_WORKERS = "2"
CACHE_DIR = "./cache"
PORT = "8080"

[tools]
python = "3.13"

[tasks.install]
run = "pip install -r requirements.txt"

[tasks.test]
run = ["pip install -q -r requirements-test.txt", "python -m pytest"]

[tasks.dev]
run = "python main.py"
