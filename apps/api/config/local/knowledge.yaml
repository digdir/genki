endpoints:
  # The knowledge server (ADR 0042): every pgvector dataset, shared with every organisation as the
  # default for new datasets and connectors. A stored entry of the same id, as in test, beats this one.
  kunnskapsserveren:
    name: Kunnskapsserveren
    engine: pgvector
    # Written out, though it is the default: a release before issue 151 reads a missing one as platform.
    options: { connection: knowledge }
    sharing: { tenants: '*' }
datasets:
  - id: digdir/kudos
    name: Kudos
    aliases: [public-sector-knowledge/default, public-sector-knowledge/kudos]
    endpoint: kunnskapsserveren
    # global, so a switch may embed it with the global models while #131 decides where Kudos may be processed.
    residency: global
    links: kudos-legacy
    filters:
      type: multiselect
      concerned_years: multiselect
      orgs_short: multiselect
      orgs_long: multiselect
      doc_num: multiselect
      title: text
    valueTypes: { concerned_years: integer }
  - id: digdir/public-docs
    name: Offentlige nettsider
    aliases: [digdir/default]
    endpoint: kunnskapsserveren
    residency: global
  - id: digdir/kudos-parts
    name: Kudos fra deler
    description: Et utvalg av Kudos delt opp side for side fra konverteringens deler, uten topp- og bunntekst, til sammenligning med sidene i digdir/kudos (issue 635)
    endpoint: kunnskapsserveren
    # The generation it is read by; the kudos-parts pipeline fills it at its first run.
    generation: g-20261123-4f2a91
    residency: global
    embedding: { model: foundry/text-embedding-3-small, dimensions: 1536 }
    filters:
      type: multiselect
      concerned_years: multiselect
      orgs_short: multiselect
      orgs_long: multiselect
      doc_num: multiselect
      title: text
    valueTypes: { concerned_years: integer }
  - id: digdir/genki-docs
    name: GenKI-dokumentasjon
    description: Dokumentasjonen til GenKI selv, lest inn fra filene i koden som kjører
    endpoint: kunnskapsserveren
    # The generation it is read by; the folder pipeline fills it at its first run.
    generation: g-20261120-9d0c5e
    residency: global
    embedding: { model: foundry/text-embedding-3-small, dimensions: 1536 }
    options: { textSearchConfig: english }
