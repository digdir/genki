dataset: digdir/genki-docs
id: genki-docs
spec:
  name: GenKI-dokumentasjonen
  description: README, bidragsregler, sikkerhet, ADR-er, utviklerdokumentasjon, API-dokumentasjon og README-ene til pakkene, slik de ligger i koden som kjører
  source:
    kind: folder
    path: .
    include:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - docs/**/*.md
      - packages/*/README.md
      - apps/*/README.md
      - examples/*/README.md
    baseUrl: https://github.com/digdir/genki/blob/main/
    keepExtension: true
    titleFrom: heading
