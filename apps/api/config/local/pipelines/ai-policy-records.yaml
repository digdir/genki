dataset: digdir/ai-policy
id: ai-policy-records
spec:
  name: Every AI Policy Ever, records
  description: 'Ett dokument per instrument fra data/records.parquet i Hugging Face-datasettet kelkalot/every-ai-policy-ever (CC-BY-4.0)'
  source:
    kind: parquet
    huggingface: { dataset: kelkalot/every-ai-policy-ever, file: data/records.parquet }
    mapping:
      fields:
        id: id
        title: title
        text: [summary, notes]
        url: official_url
        date: date_published
        year: date_published
        metadata:
          - { column: id, as: record_id }
          - jurisdiction
          - country
          - region
          - jurisdiction_level
          - instrument_type
          - legal_force
          - status
          - short_title
          - date_published
          - date_in_force
          - date_last_updated
          - english_version
          - english_version_by
          - verification_level
          - safety_topics
          - issuing_body
          - official_identifier
          - verification_note
        constants: { doc_kind: record }
  chunking: { minimumLength: 1, maximumLength: 8000 }
  schedule: weekly
