apiVersion: genai/v1
kind: Service
metadata: { tenant: '991825827', id: builtin-skills, name: 'Innebygde ferdigheter' }
spec:
  purpose: 'Enkeltferdigheter: hent ut entiteter, oppsummer, og søk med flere spørringer'
  audience: [employees]
  riskClass: minimal
  variants:
    - id: entity-extraction
    - id: summarization
      overrides: { 'flow': 'summarization@1' }
    - id: multi-retrieval
      overrides: { 'flow': 'multi-retrieval@1' }
  input: { accepts: [text/plain] }
  output: { kind: answer, withSources: true }
  strategy:
    id: step-flow
    version: 1
    config: { 'flow': 'entity-extraction@1' }
  knowledge:
    datasets:
      - dataset: digdir/kudos
    reranker: colbert
    retrieval: { maxPerDocument: 10 }
  model: { primary: foundry-openai/gpt-4o-2m-tps, residency: global }
  exposure: { mcp: true, openai: true, rest: true }
