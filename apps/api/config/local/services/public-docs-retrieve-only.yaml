apiVersion: genai/v1
kind: Service
metadata:
  { tenant: '991825827', id: public-docs-retrieve-only, name: 'Digdir-dokumentasjon, bare søk' }
spec:
  purpose: Finn kilder i Digdirs offentlige dokumentasjon uten å lage et svar
  audience: [employees]
  riskClass: limited
  variants:
    - id: default
  input: { accepts: [text/plain] }
  output: { kind: answer, withSources: true }
  strategy:
    id: rag-single-shot
    version: 1
    config: { generate: false }
  knowledge:
    datasets:
      - dataset: digdir/public-docs
    reranker: colbert
    retrieval: { maxPerDocument: 10 }
  model: { primary: foundry-openai/gpt-5.6-terra, residency: global }
  exposure: { mcp: true, openai: true, rest: true }
