apiVersion: genai/v1
kind: Service
metadata: { tenant: '991825827', id: public-docs-agent, name: 'Digdir-dokumentasjon, agent' }
spec:
  purpose: Svar med kilder fra Digdirs offentlige nettsider og dokumentasjon
  audience: [employees]
  riskClass: limited
  variants:
    - id: default
  input: { accepts: [text/plain] }
  output: { kind: answer, withSources: true }
  strategy:
    id: agent-loop
    version: 1
    config:
      budget: { searches: 4, reads: 6, readChars: 12000 }
      temperature: 0.3
  knowledge:
    datasets:
      - dataset: digdir/public-docs
    reranker: colbert
    retrieval: { maxPerDocument: 10, rerank: { enabled: true } }
  model: { primary: foundry-openai/gpt-4o-2m-tps, residency: global }
  exposure: { mcp: true, openai: true, rest: true }
