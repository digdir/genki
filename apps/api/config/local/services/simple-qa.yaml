apiVersion: genai/v1
kind: Service
metadata: { tenant: '991825827', id: simple-qa, name: 'Enkle spørsmål og svar' }
spec:
  purpose: 'Svar med kilder fra ett søk, uten agentløkke'
  audience: [employees]
  riskClass: limited
  variants:
    - id: default
    - id: basic-rag
      overrides: { 'flow': 'basic-rag@1' }
    - id: multi-query-rag
      overrides: { 'flow': 'multi-query-rag@1' }
    - id: retrieve-and-rerank
      overrides: { 'flow': 'retrieve-and-rerank@1' }
  input: { accepts: [text/plain] }
  output: { kind: answer, withSources: true }
  strategy:
    id: step-flow
    version: 1
    config: { 'flow': 'basic-rag@1' }
  knowledge:
    datasets:
      - dataset: digdir/kudos
    reranker: colbert
    retrieval: { maxPerDocument: 10 }
  model: { primary: foundry-openai/gpt-4o-2m-tps, residency: global }
  exposure: { mcp: true, openai: true, rest: true }
