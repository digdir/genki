apiVersion: genai/v1
kind: Service
metadata: { tenant: '991825827', id: ai-policy-brief, name: KI-regelverksnotat }
spec:
  purpose: Et kort notat om de bindende KI-reglene på et tema, med tabell, kilder og verifiseringsnivå, fra registeret Every AI Policy Ever (kelkalot, CC-BY-4.0)
  exampleQuestions:
    - nb: Hvilke bindende regler finnes om merking av KI-generert innhold?
      en: Which binding rules exist on labelling AI-generated content?
    - nb: Hvilke lover regulerer KI-modeller for allmenne formål?
      en: Which laws regulate general-purpose AI models?
  audience: [employees]
  riskClass: limited
  languages: [nb, en]
  input: { accepts: [text/plain] }
  output: { kind: answer, withSources: true }
  strategy:
    id: step-flow
    version: 1
    config: { flow: 'ai-policy-brief@1' }
  knowledge:
    datasets:
      - dataset: digdir/ai-policy
    retrieval: { maxPerDocument: 3 }
  model: { primary: foundry-openai/gpt-4o-2m-tps, residency: global }
  exposure: { chat: true, openai: true }
