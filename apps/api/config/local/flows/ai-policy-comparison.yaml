apiVersion: genai/v1
kind: StepFlow
metadata: { tenant: '991825827', id: ai-policy-comparison, name: AI policy jurisdiction comparison }
spec:
  purpose: Compare how two to four jurisdictions regulate an AI topic. Retrieves sources for each, then writes a side-by-side table with citations and verification levels. Reports any additional jurisdictions as not compared.
  steps:
    - id: jurisdictions
      name: Finn jurisdiksjonene og lag engelske søk
      block: extract@1
      input:
        prompt: |
          Hvilke jurisdiksjoner (land, delstater, EU eller internasjonale organisasjoner) ber spørsmålet om å sammenligne? Oversett navnene til engelsk og velg dem fra listen i skjemaet: Norge er "Norway", Sverige "Sweden", Danmark "Denmark", Island "Iceland", Tyskland "Germany", Frankrike "France", Storbritannia "United Kingdom", Kina "China", Sør-Korea "South Korea", EU "European Union" og USA "United States". En amerikansk delstat skrives med "(US)", for eksempel "California (US)". Legg en jurisdiksjon i missing bare når det engelske navnet ikke står i listen.

          Ta med høyst fire i jurisdictions, og bare dem spørsmålet ber om å sammenligne. Ber spørsmålet om flere, velg de fire første som står i listen og legg alle de øvrige kjente jurisdiksjonene i notCompared. Legg ukjente navn i missing. Alle forespurte jurisdiksjoner skal være med i ett av de tre feltene; utelat aldri et navn stille. Nevnes EUs KI-forordning bare som tema, er EU ikke en av jurisdiksjonene. Eksempel: for "Sammenlign Norge, Sverige og Danmark når det gjelder gjennomføringen av EUs KI-forordning" er jurisdiksjonene Norway, Sweden og Denmark.

          Lag også tre til fem korte søk på engelsk om temaet, fordi registeret er skrevet på engelsk. Skriv dem uten navn på jurisdiksjoner, for søket gjøres for hver jurisdiksjon for seg. For eksempel "deepfake labelling requirements" eller "national implementation of the EU AI Act".

          Spørsmål: {{input.query}}
      params:
        name: jurisdictions
        temperature: 0
        schema:
