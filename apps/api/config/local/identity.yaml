    description: Leder i NAV, regnskapsfører uten tilgang i DDG Fitness AS, bare Bruke tjenester i underenheten i Oslo
    parties:
      - { orgno: '889640782', roles: [LEDE] }
      - { orgno: '897069650', roles: [REGNA] }
      - { orgno: '897069651', accessPackages: ['urn:altinn:accesspackage:ki-tjenester'] }

  - pid: '05057012345'
    name: Hensynsløs Måke
    userId: 20005
    description: Ingen tilganger i Altinn
    parties: []

# Public SPA clients: PKCE S256, no client secret. They request the Altinn resource in authorization_details.
clients:
  - clientId: local-portal
    redirectUris: ['http://localhost:5175/callback', 'http://localhost:5173/callback']
    postLogoutRedirectUris: ['http://localhost:5175/', 'http://localhost:5173/']
    audience: digdir:genai
    tokenEndpointAuthMethod: none

  - clientId: local-console
    redirectUris: ['http://localhost:5174/callback']
    postLogoutRedirectUris: ['http://localhost:5174/']
    audience: digdir:genai
    tokenEndpointAuthMethod: none

  - clientId: local-workspace
    redirectUris: ['http://localhost:5176/callback']
    postLogoutRedirectUris: ['http://localhost:5176/']
    audience: digdir:genai
    tokenEndpointAuthMethod: none
