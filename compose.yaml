services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai-local-only
      POSTGRES_DB: genai
    ports:
      - '127.0.0.1:${GENAI_POSTGRES_PORT:-55432}:5432'
    volumes:
      - genai-postgres:/var/lib/postgresql/data
  knowledge:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai-local-only
      POSTGRES_DB: genai_knowledge
    ports:
      - '127.0.0.1:${GENAI_KNOWLEDGE_PORT:-55433}:5432'
    volumes:
      - genai-knowledge:/var/lib/postgresql/data
volumes:
  genai-postgres:
  genai-knowledge:
