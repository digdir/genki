services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai-local-only
      POSTGRES_DB: genai
    ports:
      - '127.0.0.1:${GENAI_POSTGRES_PORT:-55432}:5432'
    volumes:
      - genai-postgres:/var/lib/postgresql/data
  knowledge:
    image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai-local-only
      POSTGRES_DB: genai_knowledge
    ports:
      - '127.0.0.1:${GENAI_KNOWLEDGE_PORT:-55433}:5432'
    volumes:
      - genai-knowledge:/var/lib/postgresql/data
volumes:
  genai-postgres:
  genai-knowledge:
