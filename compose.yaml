services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai-local-only
      POSTGRES_DB: genai
    ports:
      - '127.0.0.1:${GENAI_POSTGRES_PORT:-55432}:5432'
    volumes:
      - genai-postgres:/var/lib/postgresql/data
  knowledge:
    image: pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai-local-only
      POSTGRES_DB: genai_knowledge
    ports:
      - '127.0.0.1:${GENAI_KNOWLEDGE_PORT:-55433}:5432'
    volumes:
      - genai-knowledge:/var/lib/postgresql/data
volumes:
  genai-postgres:
  genai-knowledge:
