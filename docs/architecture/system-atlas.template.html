<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>System Atlas · genki</title>
    <style>
      :root {
        --bg: #071018;
        --panel-3: #122230;
        --line: #203544;
        --text: #eef6f8;
        --muted: #8fa8b3;
        --muted-2: #607b88;
        --cyan: #46d7c8;
        --cyan-soft: rgba(70, 215, 200, 0.12);
        --blue: #74a7ff;
        --violet: #a78bfa;
        --orange: #f1a46a;
        --green: #70d6a1;
        --danger: #ff8790;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
        --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 12% -15%, rgba(58, 188, 187, 0.13), transparent 34rem),
          radial-gradient(circle at 86% 8%, rgba(65, 102, 180, 0.1), transparent 28rem), var(--bg);
        font-family: var(--sans);
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      .shell {
        height: 100vh;
        display: grid;
        grid-template-rows: 64px minmax(0, 1fr);
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 0 24px;
        border-bottom: 1px solid rgba(57, 86, 103, 0.55);
        background: rgba(7, 16, 24, 0.76);
        backdrop-filter: blur(20px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 0;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(70, 215, 200, 0.42);
        border-radius: 11px;
        background: linear-gradient(145deg, rgba(70, 215, 200, 0.18), rgba(70, 215, 200, 0.03));
      }
      .brand-mark svg {
        width: 20px;
        color: var(--cyan);
      }
      .brand-title {
        font-size: 15px;
        font-weight: 720;
        letter-spacing: -0.01em;
      }
      .brand-subtitle {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }
      .top-meta {
        display: flex;
        align-items: center;
        gap: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .stat {
        font-family: var(--mono);
        color: #b8ccd4;
        white-space: nowrap;
      }
      .stat b {
        color: var(--cyan);
        font-weight: 600;
      }
      .status-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 5px rgba(112, 214, 161, 0.08);
      }

      .workspace {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(380px, 440px);
        gap: 12px;
        padding: 12px;
      }
      .panel {
        min-height: 0;
        border: 1px solid rgba(42, 68, 84, 0.78);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(13, 27, 39, 0.96), rgba(9, 20, 29, 0.98));
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .architecture {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 18px;
        padding: 14px 18px;
        border-bottom: 1px solid rgba(38, 63, 78, 0.7);
      }
      .panel-head h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: -0.01em;
      }
      .panel-head p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .head-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn {
        border-radius: 8px;
        padding: 7px 11px;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: #0c1b25;
        color: #a9bfc7;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: #3c6171;
        color: #d8e8ec;
      }
      .btn.active {
        border-color: rgba(70, 215, 200, 0.7);
        color: var(--cyan);
        background: var(--cyan-soft);
      }
      .btn.orange {
        color: var(--orange);
        border-color: color-mix(in srgb, var(--orange) 42%, transparent);
        background: color-mix(in srgb, var(--orange) 12%, transparent);
      }
      .btn.orange.active,
      .btn.orange:hover {
        background: color-mix(in srgb, var(--orange) 24%, transparent);
      }
      .btn.violet {
        color: var(--violet);
        border-color: color-mix(in srgb, var(--violet) 42%, transparent);
        background: color-mix(in srgb, var(--violet) 12%, transparent);
      }
      .btn.violet.active,
      .btn.violet:hover {
        background: color-mix(in srgb, var(--violet) 24%, transparent);
      }
      select.btn {
        padding-right: 8px;
      }
      .search-wrap {
        position: relative;
      }
      .search-wrap svg {
        position: absolute;
        width: 15px;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted-2);
        pointer-events: none;
      }
      .search {
        width: 190px;
        height: 33px;
        padding: 0 12px 0 33px;
        color: var(--text);
        outline: 0;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #09131c;
      }
      .search::placeholder {
        color: #617b86;
      }
      .search:focus {
        border-color: rgba(70, 215, 200, 0.62);
        box-shadow: 0 0 0 3px rgba(70, 215, 200, 0.08);
      }

      .canvas-scroll {
        min-height: 0;
        overflow: auto;
      }
      .canvas {
        min-width: 760px;
        position: relative;
        padding: 20px 22px 46px 112px;
        isolation: isolate;
      }
      .edges {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        overflow: visible;
      }
      .edge {
        fill: none;
        stroke: rgba(62, 92, 108, 0.32);
        stroke-width: 1;
        transition: opacity 0.2s;
      }
      .edge.k-http {
        stroke: rgba(116, 167, 255, 0.32);
      }
      .edge.k-mock {
        stroke: rgba(241, 164, 106, 0.45);
        stroke-dasharray: 4 4;
      }
      .edge.k-sql {
        stroke: rgba(167, 139, 250, 0.4);
      }
      .edge.dimmed {
        opacity: 0.07;
      }
      .edge.related {
        stroke-width: 1.8;
        opacity: 1;
      }
      .edge.related.k-call {
        stroke: rgba(70, 215, 200, 0.75);
      }
      .edge.related.k-http {
        stroke: rgba(116, 167, 255, 0.85);
      }
      .edge.related.k-mock {
        stroke: rgba(241, 164, 106, 0.95);
      }
      .edge.related.k-sql {
        stroke: rgba(167, 139, 250, 0.9);
      }
      .edge.trace {
        stroke: #f7e27a;
        stroke-width: 2.4;
        opacity: 1;
        stroke-dasharray: 7 5;
        animation: flow 0.9s linear infinite;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -24;
        }
      }

      .plane {
        position: relative;
        z-index: 2;
        margin-bottom: 22px;
      }
      .plane:last-child {
        margin-bottom: 0;
      }
      .plane-label {
        position: absolute;
        right: calc(100% + 16px);
        top: 12px;
        width: 86px;
        color: #718b96;
        font-family: var(--mono);
        font-size: 9px;
        line-height: 1.35;
        letter-spacing: 0.13em;
        text-align: right;
        text-transform: uppercase;
      }
      .plane-label::after {
        content: '';
        display: block;
        width: 27px;
        height: 1px;
        margin: 8px 0 0 auto;
        background: #2a4351;
      }
      .node-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
        gap: 10px;
      }
      .node {
        min-height: 84px;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 11px 12px;
        text-align: left;
        border: 1px solid #243b49;
        border-radius: 11px;
        background: linear-gradient(145deg, rgba(18, 36, 49, 0.98), rgba(12, 25, 35, 0.98));
        cursor: pointer;
        outline: none;
        box-shadow:
          inset 0 1px rgba(255, 255, 255, 0.025),
          0 6px 17px rgba(0, 0, 0, 0.11);
        transition:
          transform 0.16s ease,
          border-color 0.16s ease,
          background 0.16s ease,
          opacity 0.16s ease,
          box-shadow 0.16s ease;
      }
      .node.external {
        border-style: dashed;
        background: linear-gradient(145deg, rgba(14, 26, 35, 0.9), rgba(9, 19, 27, 0.9));
      }
      .node:hover {
        transform: translateY(-2px);
        border-color: #3c6171;
      }
      .node:focus-visible {
        box-shadow: 0 0 0 3px rgba(70, 215, 200, 0.16);
        border-color: var(--cyan);
      }
      .node.selected {
        border-color: rgba(70, 215, 200, 0.85);
        background: linear-gradient(145deg, rgba(24, 71, 73, 0.9), rgba(12, 38, 44, 0.98));
        box-shadow:
          0 0 0 1px rgba(70, 215, 200, 0.08),
          0 13px 30px rgba(0, 0, 0, 0.24);
      }
      .node.connected {
        border-color: rgba(70, 215, 200, 0.4);
      }
      .node.dimmed {
        opacity: 0.42;
      }
      .node.hidden-search {
        opacity: 0.1;
        filter: saturate(0.2);
      }
      .node.trace-on {
        border-color: #f7e27a;
        box-shadow:
          0 0 0 3px rgba(247, 226, 122, 0.18),
          0 13px 30px rgba(0, 0, 0, 0.3);
        opacity: 1;
        transform: translateY(-2px);
      }
      .node.trace-seen {
        border-color: rgba(247, 226, 122, 0.45);
        opacity: 1;
      }
      .node-top {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .node-icon {
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        color: var(--node-color, var(--cyan));
        border-radius: 7px;
        background: color-mix(in srgb, var(--node-color, var(--cyan)) 13%, transparent);
      }
      .node-icon svg {
        width: 14px;
        height: 14px;
      }
      .node-index {
        color: #55707d;
        font: 9px var(--mono);
        letter-spacing: 0.04em;
      }
      .node-name {
        color: #f0f7f8;
        font-size: 12.5px;
        font-weight: 690;
        line-height: 1.2;
      }
      .node-note {
        color: #7f99a4;
        font-size: 10.5px;
        line-height: 1.25;
      }
      .node-old {
        display: none;
        flex-wrap: wrap;
        gap: 3px;
      }
      .mapping .node-old {
        display: flex;
      }
      .old-chip {
        padding: 1px 5px;
        border-radius: 4px;
        font: 8.5px var(--mono);
        color: var(--violet);
        background: rgba(167, 139, 250, 0.14);
      }
      .legend {
        position: absolute;
        z-index: 3;
        right: 22px;
        bottom: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 13px;
        color: #6f8a95;
        font-size: 10px;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend i {
        width: 16px;
        height: 0;
        border-top: 2px solid;
      }
      .empty-search {
        display: none;
        position: absolute;
        z-index: 5;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #75909a;
        text-align: center;
      }
      .empty-search.show {
        display: block;
      }

      .details {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }
      .detail-head {
        padding: 16px 19px 13px;
        border-bottom: 1px solid rgba(38, 63, 78, 0.7);
      }
      .detail-kicker {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--detail-color, var(--cyan));
        font: 10px var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .pill {
        padding: 4px 7px;
        border: 1px solid #2d4654;
        border-radius: 999px;
        color: #8fa9b4;
        font: 9px var(--mono);
        letter-spacing: 0.05em;
        text-transform: none;
      }
      .detail-title {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-top: 10px;
      }
      .detail-title-icon {
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 9px;
        color: var(--detail-color, var(--cyan));
        background: color-mix(in srgb, var(--detail-color, var(--cyan)) 13%, transparent);
      }
      .detail-title-icon svg {
        width: 18px;
      }
      .detail-title h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .detail-body {
        overflow: auto;
        padding: 14px 19px 22px;
      }
      .lead {
        margin: 0 0 10px;
        color: #e2eef1;
        font-size: 13.5px;
        line-height: 1.5;
      }
      .detail-description {
        margin: 0 0 6px;
        color: #aec1c8;
        font-size: 12.5px;
        line-height: 1.62;
      }
      .detail-section {
        margin-top: 17px;
      }
      .detail-section h3 {
        margin: 0 0 8px;
        color: #738e99;
        font: 9px var(--mono);
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .bullets {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 7px;
      }
      .bullets li {
        position: relative;
        padding-left: 14px;
        color: #9eb3bb;
        font-size: 11.5px;
        line-height: 1.45;
      }
      .bullets li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0.55em;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--detail-color, var(--cyan));
        opacity: 0.85;
      }
      .io-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .io {
        padding: 9px 10px;
        border: 1px solid #1f3644;
        border-radius: 8px;
        background: rgba(6, 15, 22, 0.45);
      }
      .io b {
        display: block;
        margin-bottom: 4px;
        color: #66838f;
        font: 8px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .io span {
        color: #afc1c7;
        font-size: 11px;
        line-height: 1.35;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .file {
        max-width: 100%;
        padding: 5px 7px;
        overflow: hidden;
        text-overflow: ellipsis;
        border: 1px solid #233e4c;
        border-radius: 6px;
        color: #8db1bd;
        background: rgba(23, 50, 62, 0.45);
        font: 9.5px var(--mono);
        white-space: nowrap;
      }
      .replace-row {
        display: grid;
        gap: 3px;
        padding: 8px 10px;
        border: 1px solid rgba(167, 139, 250, 0.3);
        border-radius: 8px;
        background: rgba(167, 139, 250, 0.06);
      }
      .replace-row b {
        color: #cdbdfd;
        font-size: 12px;
      }
      .replace-row span {
        color: #a99fc9;
        font-size: 11px;
      }
      .replace-list {
        display: grid;
        gap: 7px;
      }
      .edge-list {
        display: grid;
        gap: 8px;
      }
      .edge-row {
        border: 1px solid rgba(38, 63, 78, 0.7);
        border-radius: 9px;
        padding: 8px 10px;
        display: grid;
        gap: 4px;
      }
      .edge-row-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 12.5px;
      }
      .link {
        padding: 0;
        border: 0;
        background: none;
        color: #e6f2f4;
        font-weight: 650;
        cursor: pointer;
        text-align: left;
      }
      .link:hover {
        color: var(--cyan);
        text-decoration: underline;
      }
      .edge-label {
        color: #aec1c8;
        font-size: 11.5px;
      }
      .badge {
        font: 9px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 7px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .badge.call {
        background: rgba(70, 215, 200, 0.14);
        color: var(--cyan);
      }
      .badge.http {
        background: rgba(116, 167, 255, 0.16);
        color: #8fb9f0;
      }
      .badge.sql {
        background: rgba(167, 139, 250, 0.16);
        color: var(--violet);
      }
      .badge.changes {
        background: rgba(240, 164, 95, 0.18);
        color: #f0a45f;
      }
      .evidence {
        font: 9.5px var(--mono);
        color: #7fa88a;
        overflow-wrap: anywhere;
      }
      .schema {
        margin-top: 8px;
        border: 1px solid #1f3644;
        border-radius: 8px;
        padding: 8px 10px;
      }
      .schema summary {
        cursor: pointer;
        color: #9fb8c1;
        font: 10.5px var(--mono);
      }
      .schema-json {
        margin: 9px 0 0;
        padding: 10px;
        max-height: 340px;
        background: var(--panel-3);
        border-radius: 7px;
        overflow: auto;
        font: 10.5px/1.5 var(--mono);
        color: #b9ccd4;
      }
      .muted {
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.5;
      }
      .old-card {
        border: 1px solid rgba(167, 139, 250, 0.28);
        border-radius: 9px;
        padding: 9px 11px;
        display: grid;
        gap: 6px;
        cursor: pointer;
        background: rgba(167, 139, 250, 0.04);
      }
      .old-card:hover,
      .old-card.active {
        border-color: rgba(167, 139, 250, 0.75);
        background: rgba(167, 139, 250, 0.1);
      }
      .old-card-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
      }
      .old-card-head b {
        font-size: 12.5px;
        color: #e5ddff;
      }
      .old-card-head span {
        font: 9.5px var(--mono);
        color: #8d83b3;
      }
      .new-chip {
        padding: 3px 7px;
        border: 1px solid #2c4756;
        border-radius: 6px;
        font-size: 10.5px;
        color: #bfe9e3;
        background: rgba(70, 215, 200, 0.07);
        cursor: pointer;
      }
      .new-chip:hover {
        border-color: var(--cyan);
      }
      .steps {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 6px;
        counter-reset: step;
      }
      .steps li {
        counter-increment: step;
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 9px;
        padding: 8px 10px;
        border: 1px solid rgba(38, 63, 78, 0.7);
        border-radius: 9px;
        cursor: pointer;
        opacity: 0.55;
        transition:
          opacity 0.2s,
          border-color 0.2s,
          background 0.2s;
      }
      .steps li::before {
        content: counter(step);
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font: 10px var(--mono);
        color: #0b1620;
        background: #55707d;
      }
      .steps li.done {
        opacity: 0.85;
      }
      .steps li.on {
        opacity: 1;
        border-color: rgba(247, 226, 122, 0.7);
        background: rgba(247, 226, 122, 0.06);
      }
      .steps li.on::before {
        background: #f7e27a;
      }
      .steps b {
        display: block;
        font-size: 12px;
        color: #eef6f8;
      }
      .steps span {
        color: #a5bac2;
        font-size: 11.5px;
        line-height: 1.45;
      }
      .trace-controls {
        display: flex;
        gap: 6px;
        margin: 2px 0 12px;
      }

      @media (max-width: 1080px) {
        .shell {
          height: auto;
        }
        .workspace {
          grid-template-columns: 1fr;
        }
        .architecture {
          height: 78vh;
        }
        .details {
          height: 80vh;
        }
      }
      @media (max-width: 760px) {
        .topbar {
          padding: 10px 16px;
          height: auto;
          flex-wrap: wrap;
        }
        .shell {
          grid-template-rows: auto 1fr;
        }
        .workspace {
          padding: 8px;
        }
        .search {
          width: min(76vw, 300px);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" data-icon="network"></div>
          <div>
            <div class="brand-title">System Atlas</div>
            <div class="brand-subtitle">genki, the successor to digdir-headless-rag</div>
          </div>
        </div>
        <div class="top-meta" id="top-meta"></div>
      </header>
      <main class="workspace">
        <section class="panel architecture" aria-labelledby="architecture-title">
          <div class="panel-head">
            <div>
              <h1 id="architecture-title">Architecture map</h1>
              <p>Select a module to see its role, contracts and witnessed connections.</p>
            </div>
            <div class="head-actions">
              <select id="trace-select" class="btn" aria-label="Play a request trace">
                <option value="">Trace a request…</option>
              </select>
              <button id="mapping-btn" class="btn violet" type="button">
                Replaces headless-rag
              </button>
              <button id="migration-btn" class="btn orange" type="button">Mock → live</button>
              <label class="search-wrap" aria-label="Find a module">
                <span data-icon="search"></span>
                <input
                  id="module-search"
                  class="search"
                  type="search"
                  placeholder="Find a module…"
                  autocomplete="off"
                />
              </label>
            </div>
          </div>
          <div class="canvas-scroll" id="canvas-scroll">
            <div id="canvas" class="canvas">
              <svg id="edges" class="edges" aria-hidden="true"></svg>
              <div id="planes"></div>
              <div id="empty-search" class="empty-search">No modules match that search.</div>
              <div class="legend">
                <span><i style="border-color: #46d7c8"></i>in-process import</span>
                <span><i style="border-color: #74a7ff"></i>HTTP</span>
                <span><i style="border-color: #a78bfa"></i>SQL</span>
                <span
                  ><i style="border-color: #f1a46a; border-top-style: dashed"></i>mock, becomes
                  live</span
                >
              </div>
            </div>
          </div>
        </section>
        <section class="panel details" aria-live="polite">
          <div id="detail-head" class="detail-head"></div>
          <div id="detail-body" class="detail-body"></div>
        </section>
      </main>
    </div>

    <script>
      const atlas = /*{{ATLAS}}*/ null;

      const icons = {
        network:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="3" width="6" height="6" rx="1.5"/><rect x="9" y="15" width="6" height="6" rx="1.5"/><path d="M6 9v3h6m6-3v3h-6v3"/></svg>',
        api: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 9 4 12l4 3m8-6 4 3-4 3m-2-9-4 12"/></svg>',
        gateway:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h7v14H4zm9 3h7v8h-7M8 9h6m-6 6h6"/></svg>',
        ui: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M3 8h18M7 6h.01"/></svg>',
        chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14a4 4 0 0 1-4 4H8l-5 3V8a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4z"/><path d="M8 10h8m-8 4h5"/></svg>',
        shield:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 20 6v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>',
        config:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h9m4 0h3M4 17h3m4 0h9M13 5v4M7 15v4"/></svg>',
        scope:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>',
        setup:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="8"/></svg>',
        graph:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="m7 7 4 9m6-9-4 9M7 6h10"/></svg>',
        agent:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M9 12h.01M15 12h.01M9 16h6M12 3v4"/></svg>',
        rag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5M8 8h4m-4 3h3"/></svg>',
        llm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a4 4 0 0 1 4 4 4 4 0 0 1 2 7 4 4 0 0 1-6 4 4 4 0 0 1-6-4 4 4 0 0 1 2-7 4 4 0 0 1 4-4z"/><path d="M12 3v16"/></svg>',
        source:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h6l2 2h8v12H4z"/><path d="M8 12h8m-8 4h5"/></svg>',
        pipeline:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="5" height="5" rx="1"/><rect x="16" y="14" width="5" height="5" rx="1"/><path d="M8 7.5h4a3 3 0 0 1 3 3v1a3 3 0 0 0 3 3"/></svg>',
        search:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>',
        database:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg>',
        chart:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg>',
        pulse:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>',
        spark:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6z"/></svg>',
        swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>',
        play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m7 4 13 8-13 8z"/></svg>',
      };

      const planes = [
        { id: 'consumers', label: 'Consumers & channels' },
        { id: 'adapters', label: 'Protocol adapters' },
        { id: 'composition', label: 'Apps & composition' },
        { id: 'runtime', label: 'Runtime & strategies' },
        { id: 'services', label: 'Platform services' },
        { id: 'policy', label: 'Identity & policy' },
        { id: 'ports', label: 'Ports' },
        { id: 'providers', label: 'Providers' },
        { id: 'external', label: 'External systems' },
      ];

      const modules = atlas.modules;
      const byId = Object.fromEntries(modules.map((m) => [m.id, m]));
      const oldById = Object.fromEntries(atlas.headlessRag.map((o) => [o.id, o]));
      const typedEdges = modules.flatMap((m) => (m.edges || []).map((e) => ({ from: m.id, ...e })));
      const changingEdges = typedEdges.filter((e) => e.kind !== e.target);
      const kindLabel = { call: 'import', http: 'HTTP', sql: 'SQL', mock: 'mock' };

      const state = {
        selected: 'kernel',
        view: 'module',
        oldFocus: null,
        trace: null,
        step: 0,
        timer: null,
      };

      const esc = (v) =>
        String(v ?? '').replace(
          /[&<>'"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c],
        );
      const nameOf = (id) => (byId[id] ? byId[id].name : id);
      const hydrateIcons = (root = document) =>
        root.querySelectorAll('[data-icon]').forEach((el) => {
          el.innerHTML = icons[el.dataset.icon] || '';
        });
      const link = (id) =>
        `<button class="link" type="button" data-goto="${esc(id)}">${esc(nameOf(id))}</button>`;

      function renderTopMeta() {
        const internal = modules.filter((m) => !m.external).length;
        document.getElementById('top-meta').innerHTML =
          `<span class="stat"><b>${internal}</b> modules</span>` +
          `<span class="stat"><b>${modules.length - internal}</b> external</span>` +
          `<span class="stat"><b>${typedEdges.length}</b> witnessed edges</span>` +
          `<span class="stat"><b>${modules.filter((m) => m.schemas && m.schemas.length).length}</b> with contracts</span>` +
          `<span><i class="status-dot"></i>generated from the code</span>`;
      }

      function renderPlanes() {
        const root = document.getElementById('planes');
        root.innerHTML = planes
          .map(
            (plane) => `
        <section class="plane" data-plane="${plane.id}">
          <div class="plane-label">${esc(plane.label)}</div>
          <div class="node-grid">
            ${modules
              .filter((m) => m.plane === plane.id)
              .map(
                (m) => `
              <button class="node${m.external ? ' external' : ''}" type="button" data-module="${esc(m.id)}" style="--node-color:${esc(m.color)}" aria-label="Inspect ${esc(m.name)}">
                <span class="node-top"><span class="node-icon" data-icon="${esc(m.icon)}"></span><span class="node-index">${String(modules.indexOf(m) + 1).padStart(2, '0')}</span></span>
                <span class="node-name">${esc(m.name)}</span>
                <span class="node-note">${esc(m.note)}</span>
                <span class="node-old">${(m.replaces || []).map((r) => `<span class="old-chip">${esc(r.module)}</span>`).join('')}</span>
              </button>`,
              )
              .join('')}
          </div>
        </section>`,
          )
          .join('');
        hydrateIcons(root);
        root
          .querySelectorAll('.node')
          .forEach((node) =>
            node.addEventListener('click', () => selectModule(node.dataset.module)),
          );
      }

      function edgeBadge(e) {
        if (e.kind !== e.target)
          return `<span class="badge changes">${kindLabel[e.kind]} → ${kindLabel[e.target]}</span>`;
        return `<span class="badge ${e.kind}">${kindLabel[e.kind]}</span>`;
      }

      function evidenceOf(e) {
        if (!e.witness) return '';
        if (e.witness.imports)
          return `<span class="evidence" title="checked by the atlas test">witness: ${esc(e.witness.file)} imports ${esc(e.witness.imports)}</span>`;
        return `<span class="evidence" title="checked by the atlas test">witness: ${esc(e.witness.file)} contains “${esc(e.witness.contains)}”</span>`;
      }

      function edgeRow(e, title) {
        return `<div class="edge-row"><div class="edge-row-head">${title}${edgeBadge(e)}</div><span class="edge-label">${esc(e.label)}</span>${evidenceOf(e)}</div>`;
      }

      function setHead(kicker, pill, title, icon, color) {
        document.documentElement.style.setProperty('--detail-color', color);
        const head = document.getElementById('detail-head');
        head.innerHTML = `
        <div class="detail-kicker"><span>${esc(kicker)}</span>${pill ? `<span class="pill">${esc(pill)}</span>` : ''}</div>
        <div class="detail-title"><span class="detail-title-icon" data-icon="${esc(icon)}"></span><h2>${esc(title)}</h2></div>`;
        hydrateIcons(head);
      }

      function setBody(html) {
        const body = document.getElementById('detail-body');
        body.innerHTML = html;
        body.scrollTop = 0;
        hydrateIcons(body);
        body
          .querySelectorAll('[data-goto]')
          .forEach((el) => el.addEventListener('click', () => selectModule(el.dataset.goto)));
      }

      function renderModule(m) {
        setHead(planes.find((p) => p.id === m.plane).label, m.status, m.name, m.icon, m.color);
        const out = m.edges || [];
        const incoming = typedEdges.filter((e) => e.to === m.id);
        const section = (title, html) =>
          html ? `<div class="detail-section"><h3>${title}</h3>${html}</div>` : '';
        setBody(
          `<p class="lead">${esc(m.summary)}</p>` +
            (m.description && m.description !== m.summary
              ? `<p class="detail-description">${esc(m.description)}</p>`
              : '') +
            section(
              'Responsibilities',
              (m.responsibilities || []).length
                ? `<ul class="bullets">${m.responsibilities.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>`
                : '',
            ) +
            section(
              'Input / output',
              m.input || m.output
                ? `<div class="io-grid"><div class="io"><b>Input</b><span>${esc(m.input)}</span></div><div class="io"><b>Output</b><span>${esc(m.output)}</span></div></div>`
                : '',
            ) +
            section(
              'Replaces in headless-rag',
              (m.replaces || []).length
                ? `<div class="replace-list">${m.replaces.map((r) => `<div class="replace-row"><b>${esc(oldById[r.module] ? oldById[r.module].name : r.module)}</b><span>${esc(r.how)}</span></div>`).join('')}</div>`
                : m.external
                  ? ''
                  : '<p class="muted">New in genki; headless-rag had no counterpart.</p>',
            ) +
            section(
              'Contracts (JSON Schema from Zod)',
              (m.schemas || [])
                .map(
                  (s) =>
                    `<details class="schema"><summary>${esc(s.name)} · ${esc(s.export)}</summary><pre class="schema-json">${esc(JSON.stringify(s.schema, null, 2))}</pre></details>`,
                )
                .join(''),
            ) +
            section(
              `Depends on (${out.length})`,
              out.length
                ? `<div class="edge-list">${out.map((e) => edgeRow(e, link(e.to))).join('')}</div>`
                : '',
            ) +
            section(
              `Used by (${incoming.length})`,
              incoming.length
                ? `<div class="edge-list">${incoming.map((e) => edgeRow(e, link(e.from))).join('')}</div>`
                : '',
            ) +
            section(
              'Packages',
              (m.packages || []).length
                ? `<div class="chips">${m.packages.map((p) => `<span class="file">${esc(p)}</span>`).join('')}</div>`
                : '',
            ) +
            section(
              'Implementation',
              (m.files || []).length
                ? `<div class="chips">${m.files.map((f) => `<span class="file" title="${esc(f)}">${esc(f)}</span>`).join('')}</div>`
                : '',
            ),
        );
      }

      function renderMigration() {
        setHead(
          'Path to production',
          `${changingEdges.length} edges change`,
          'Mock → live',
          'swap',
          '#f1a46a',
        );
        const counts = (kind) =>
          typedEdges.filter((e) => e.kind === kind && e.target === kind).length;
        setBody(
          `<p class="lead">Every edge whose kind today differs from its target. Each row is an integration that runs against a fake now and must be switched to the real national service.</p>` +
            `<div class="edge-list">${changingEdges.map((e) => edgeRow(e, `<span>${link(e.from)} → ${link(e.to)}</span>`)).join('')}</div>` +
            `<div class="detail-section"><h3>Not in this set</h3><ul class="bullets">
          <li><b>${counts('http')}</b> HTTP edges already reach real systems: Azure AI Foundry, Typesense, ColBERT, Langfuse, tenant MCP servers and the frontends.</li>
          <li><b>${counts('sql')}</b> SQL edge to Postgres, used when DATABASE_URL is set; memory stores otherwise.</li>
          <li><b>${counts('call')}</b> in-process imports between workspace packages, each matched to a real import by the atlas test.</li>
        </ul></div>`,
        );
      }

      function renderMapping() {
        setHead(
          'Migration',
          `${atlas.headlessRag.length} old modules`,
          'Replaces headless-rag',
          'swap',
          '#a78bfa',
        );
        const successors = (id) =>
          modules.filter((m) => (m.replaces || []).some((r) => r.module === id));
        const fresh = modules.filter((m) => !m.external && !(m.replaces || []).length);
        setBody(
          `<p class="lead">Each digdir-headless-rag module and the genki modules that take over its job. Click a card to highlight its successors on the map.</p>` +
            `<div class="edge-list">${atlas.headlessRag
              .map(
                (o) => `
          <div class="old-card${state.oldFocus === o.id ? ' active' : ''}" data-old="${esc(o.id)}">
            <div class="old-card-head"><b>${esc(o.name)}</b><span>${esc(o.note)}</span></div>
            <div class="chips">${
              successors(o.id)
                .map((m) => `<span class="new-chip" data-goto="${esc(m.id)}">${esc(m.name)}</span>`)
                .join('') || '<span class="muted">no successor yet</span>'
            }</div>
          </div>`,
              )
              .join('')}</div>` +
            `<div class="detail-section"><h3>New in genki (${fresh.length})</h3><div class="chips">${fresh.map((m) => `<span class="new-chip" data-goto="${esc(m.id)}">${esc(m.name)}</span>`).join('')}</div></div>`,
        );
        document.querySelectorAll('[data-old]').forEach((card) =>
          card.addEventListener('click', (ev) => {
            if (ev.target.closest('[data-goto]')) return;
            state.oldFocus = state.oldFocus === card.dataset.old ? null : card.dataset.old;
            renderMapping();
            highlight();
          }),
        );
      }

      function renderTrace() {
        const t = state.trace;
        setHead(
          'Request trace',
          `step ${state.step + 1} of ${t.steps.length}`,
          t.name,
          'play',
          '#f7e27a',
        );
        setBody(
          `<div class="trace-controls">
          <button class="btn" type="button" id="trace-prev">‹ Back</button>
          <button class="btn active" type="button" id="trace-play">${state.timer ? 'Pause' : 'Play'}</button>
          <button class="btn" type="button" id="trace-next">Next ›</button>
          <button class="btn" type="button" id="trace-stop">Close</button>
        </div>
        <ol class="steps">${t.steps.map((s, i) => `<li data-step="${i}" class="${i === state.step ? 'on' : i < state.step ? 'done' : ''}"><div><b>${esc(nameOf(s.module))}</b><span>${esc(s.text)}</span></div></li>`).join('')}</ol>`,
        );
        document.getElementById('trace-prev').onclick = () => {
          pause();
          goStep(state.step - 1);
        };
        document.getElementById('trace-next').onclick = () => {
          pause();
          goStep(state.step + 1);
        };
        document.getElementById('trace-play').onclick = () => (state.timer ? pause() : play());
        document.getElementById('trace-stop').onclick = () => stopTrace();
        document.querySelectorAll('[data-step]').forEach((li) =>
          li.addEventListener('click', () => {
            pause();
            goStep(Number(li.dataset.step));
          }),
        );
        const on = document.querySelector('.steps li.on');
        if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
      }

      function goStep(i) {
        const t = state.trace;
        if (!t) return;
        state.step = Math.max(0, Math.min(t.steps.length - 1, i));
        renderTrace();
        highlight();
        const node = document.querySelector(`[data-module="${t.steps[state.step].module}"]`);
        if (node && node.scrollIntoView)
          node.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      function play() {
        if (!state.trace) return;
        if (state.step >= state.trace.steps.length - 1) state.step = -1;
        state.timer = setInterval(() => {
          if (state.step >= state.trace.steps.length - 1) {
            pause();
            return;
          }
          goStep(state.step + 1);
        }, 1600);
        goStep(state.step + 1);
      }

      function pause() {
        if (state.timer) clearInterval(state.timer);
        state.timer = null;
        if (state.trace && document.getElementById('trace-play'))
          document.getElementById('trace-play').textContent = 'Play';
      }

      function startTrace(id) {
        pause();
        state.trace = atlas.traces.find((t) => t.id === id) || null;
        if (!state.trace) return stopTrace();
        state.view = 'trace';
        state.step = 0;
        setButtons();
        renderTrace();
        highlight();
        play();
      }

      function stopTrace() {
        pause();
        state.trace = null;
        document.getElementById('trace-select').value = '';
        selectModule(state.selected);
      }

      function setButtons() {
        document.getElementById('mapping-btn').classList.toggle('active', state.view === 'mapping');
        document
          .getElementById('migration-btn')
          .classList.toggle('active', state.view === 'migration');
        document.getElementById('canvas').classList.toggle('mapping', state.view === 'mapping');
        if (state.view !== 'trace') document.getElementById('trace-select').value = '';
      }

      function relatedSet(id) {
        const s = new Set([id]);
        typedEdges.forEach((e) => {
          if (e.from === id) s.add(e.to);
          if (e.to === id) s.add(e.from);
        });
        return s;
      }

      function highlight() {
        const nodes = document.querySelectorAll('.node');
        nodes.forEach((n) =>
          n.classList.remove('selected', 'connected', 'dimmed', 'trace-on', 'trace-seen'),
        );
        if (state.view === 'module') {
          const rel = relatedSet(state.selected);
          nodes.forEach((n) => {
            const id = n.dataset.module;
            n.classList.toggle('selected', id === state.selected);
            n.classList.toggle('connected', rel.has(id) && id !== state.selected);
            n.classList.toggle('dimmed', !rel.has(id));
          });
        } else if (state.view === 'mapping') {
          nodes.forEach((n) => {
            const m = byId[n.dataset.module];
            const hit = state.oldFocus
              ? (m.replaces || []).some((r) => r.module === state.oldFocus)
              : (m.replaces || []).length > 0;
            n.classList.toggle('connected', hit);
            n.classList.toggle('dimmed', !hit);
          });
        } else if (state.view === 'migration') {
          const ids = new Set(changingEdges.flatMap((e) => [e.from, e.to]));
          nodes.forEach((n) => n.classList.toggle('dimmed', !ids.has(n.dataset.module)));
        } else if (state.view === 'trace') {
          const steps = state.trace.steps.map((s) => s.module);
          const seen = new Set(steps.slice(0, state.step + 1));
          nodes.forEach((n) => {
            const id = n.dataset.module;
            n.classList.toggle('trace-on', id === steps[state.step]);
            n.classList.toggle('trace-seen', seen.has(id) && id !== steps[state.step]);
            n.classList.toggle('dimmed', !seen.has(id));
          });
        }
        drawEdges();
      }

      function anchor(el, box) {
        const r = el.getBoundingClientRect();
        return {
          x: r.left - box.left + r.width / 2,
          top: r.top - box.top,
          bottom: r.bottom - box.top,
          cy: r.top - box.top + r.height / 2,
          left: r.left - box.left,
          right: r.right - box.left,
        };
      }

      function curve(a, b) {
        if (Math.abs(a.cy - b.cy) < 4) {
          const y = a.top;
          return `M ${a.x} ${y} C ${a.x} ${y - 26}, ${b.x} ${y - 26}, ${b.x} ${y}`;
        }
        const down = b.cy > a.cy;
        const y1 = down ? a.bottom : a.top;
        const y2 = down ? b.top : b.bottom;
        const mid = y1 + (y2 - y1) * 0.5;
        return `M ${a.x} ${y1} C ${a.x} ${mid}, ${b.x} ${mid}, ${b.x} ${y2}`;
      }

      function drawEdges() {
        const canvas = document.getElementById('canvas');
        const svg = document.getElementById('edges');
        const box = canvas.getBoundingClientRect();
        svg.setAttribute('viewBox', `0 0 ${box.width || 1} ${box.height || 1}`);
        const pos = {};
        document.querySelectorAll('.node').forEach((n) => {
          pos[n.dataset.module] = anchor(n, box);
        });
        let paths = '';
        let traceEdge = null;
        if (state.view === 'trace' && state.step > 0)
          traceEdge = [
            state.trace.steps[state.step - 1].module,
            state.trace.steps[state.step].module,
          ];
        const changing = new Set(changingEdges.map((e) => `${e.from}>${e.to}`));
        for (const e of typedEdges) {
          const a = pos[e.from],
            b = pos[e.to];
          if (!a || !b) continue;
          let related = false;
          if (state.view === 'module')
            related = e.from === state.selected || e.to === state.selected;
          if (state.view === 'migration') related = changing.has(`${e.from}>${e.to}`);
          const dimmed = !related;
          paths += `<path class="edge k-${e.kind}${related ? ' related' : ''}${dimmed ? ' dimmed' : ''}" d="${curve(a, b)}"/>`;
        }
        if (traceEdge && pos[traceEdge[0]] && pos[traceEdge[1]] && traceEdge[0] !== traceEdge[1]) {
          paths += `<path class="edge trace" d="${curve(pos[traceEdge[0]], pos[traceEdge[1]])}"/>`;
        }
        svg.innerHTML = paths;
      }

      function selectModule(id) {
        if (!byId[id]) return;
        pause();
        state.trace = null;
        const search = document.getElementById('module-search');
        if (search.value) {
          search.value = '';
          searchModules('');
        }
        state.selected = id;
        state.view = 'module';
        setButtons();
        renderModule(byId[id]);
        highlight();
        try {
          history.replaceState(null, '', `#${id}`);
        } catch (_) {
          /* file:// in some browsers */
        }
      }

      function searchModules(query) {
        const needle = query.trim().toLowerCase();
        let matches = 0;
        document.querySelectorAll('.node').forEach((node) => {
          const m = byId[node.dataset.module];
          const hay =
            `${m.id} ${m.name} ${m.note} ${m.summary} ${m.keywords || ''} ${(m.packages || []).join(' ')} ${(m.replaces || []).map((r) => r.module).join(' ')}`.toLowerCase();
          const hit = !needle || hay.includes(needle);
          node.classList.toggle('hidden-search', !hit);
          if (hit) matches++;
        });
        document.getElementById('empty-search').classList.toggle('show', matches === 0);
      }

      function init() {
        renderTopMeta();
        renderPlanes();
        hydrateIcons();
        const select = document.getElementById('trace-select');
        select.innerHTML += atlas.traces
          .map((t) => `<option value="${esc(t.id)}">${esc(t.name)}</option>`)
          .join('');
        select.addEventListener('change', () =>
          select.value ? startTrace(select.value) : stopTrace(),
        );
        document.getElementById('mapping-btn').addEventListener('click', () => {
          pause();
          state.trace = null;
          if (state.view === 'mapping') return selectModule(state.selected);
          state.view = 'mapping';
          state.oldFocus = null;
          setButtons();
          renderMapping();
          highlight();
        });
        document.getElementById('migration-btn').addEventListener('click', () => {
          pause();
          state.trace = null;
          if (state.view === 'migration') return selectModule(state.selected);
          state.view = 'migration';
          setButtons();
          renderMigration();
          highlight();
        });
        document
          .getElementById('module-search')
          .addEventListener('input', (ev) => searchModules(ev.target.value));
        document.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape' && state.view !== 'module') selectModule(state.selected);
          if (state.view === 'trace' && ev.key === 'ArrowRight') {
            pause();
            goStep(state.step + 1);
          }
          if (state.view === 'trace' && ev.key === 'ArrowLeft') {
            pause();
            goStep(state.step - 1);
          }
        });
        const fromHash = decodeURIComponent((location.hash || '').slice(1));
        selectModule(byId[fromHash] ? fromHash : state.selected);
        window.addEventListener('resize', () => window.requestAnimationFrame(drawEdges));
        window.addEventListener('load', drawEdges);
      }

      init();
    </script>
  </body>
</html>
