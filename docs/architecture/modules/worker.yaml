id: worker
plane: composition
name: Worker
note: Triggers and batch jobs
icon: pipeline
color: '#a78bfa'
status: App
packages:
  - '@genai/worker'
summary: 'Runs services that start by themselves: folder triggers, schedules and batch companions.'
description:
  Builds its kernel through the shared composition runtime, so a triggered run uses the same
  strategies, providers, guardrails, hooks, settings, cost limits and tracing as an API run. It
  registers each published service with a batch companion when batch is on, and binds its triggers.
  A document landing in a service folder is processed at once, as the agency system user. Without
  DATABASE_URL it refuses to start, unless GENAI_DEV_MODE=true lets it use memory stores.
responsibilities:
  - Register every published service, whatever its strategy, and its triggers
  - Run batch companions over folders
  - Act only as the worker system user
  - Record each trigger run and skip paused triggers
  - Read published services from the definition store and re-bind triggers when they change
  - Fire schedules from one worker at a time through a Postgres advisory lock
  - Install the knowledge job queues on both servers and reconcile knowledge runs every minute (ADR 0042)
  - Work knowledge.ingest on the platform server and knowledge.index on the knowledge server, behind admission on the run and the knowledge binding
  - Work knowledge.convert, 2 at once, with the text layer - fetch the file through its record, write native output to the native output store, store its pages or the converter's refusal, and send the waiting records' index jobs (ADR 0042)
  - Work knowledge.seed - store a conversion for each native output in Blob under one sha256 prefix that has none, with pages from its derivation, skipping files it cannot read (ADR 0042)
  - Count records waiting on a conversion as open work of their runs, and hand a shared conversion to a waiting run when its sender is cancelled
  - Work KNOWLEDGE_INDEX_CONCURRENCY knowledge.index and knowledge.fill jobs at once (8 by default), with knowledge pools sized to hold them
  - Wait out a throttled embedding model in knowledge.index and knowledge.fill, pausing every job on the model, for up to 20 minutes a try
  - Work knowledge.build and knowledge.fill only inside knowledge.nightWindow, and knowledge.check every night at its start
  - Work knowledge.drop on the platform server for one generation an engine switch left, never the active one
  - End a knowledge run with VACUUM (ANALYZE), and send a run's documents as fill jobs past knowledge.heavyThreshold
  - Cancel a knowledge run whose document dead letters reach its pipeline's failure budget
  - Check that the knowledge server is bound to its platform server, and answer /readyz with 503 while it is not
files:
  - apps/worker/src/main.ts
  - apps/worker/src/worker.ts
  - apps/worker/src/follow.ts
  - apps/worker/src/boot-guard.ts
  - apps/worker/src/knowledge-binding.ts
  - apps/worker/src/platform-work.ts
  - apps/worker/src/knowledge-jobs.ts
  - apps/worker/src/reconciler.ts
  - apps/worker/src/knowledge-handlers.ts
  - apps/worker/src/heavy-work.ts
  - apps/worker/src/run-progress.ts
input: Files in blob folders, schedules
output: Results written back to blob storage
replaces: []
