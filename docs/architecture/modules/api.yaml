id: api
plane: composition
name: API app
note: Composition root (Hono)
icon: network
color: '#a78bfa'
status: App
packages:
  - '@genai/api'
summary: 'The one place that wires plugins together: routers, strategies, adapters, identity and stores.'
description: apps/api reads platform wiring once at boot and fails fast (ADR 0005). It builds the
  kernel through the shared composition runtime, adds the eval and builder strategies and the admin
  modules, mounts the protocol adapters and the portal and console routes, and chooses Postgres and
  the Altinn PDP or, only with GENAI_DEV_MODE=true, memory stores and the mock Altinn rights.
responsibilities:
  - Compose ports, providers and strategies into a kernel
  - Mount MCP, /v1, REST, conversation, portal and console routes
  - Authenticate callers and choose stores
  - Run a published service over a document set, with a cost estimate, a cost cap and a retry list
  - Keep projects of document selections, and subscriptions that run a service on new documents under a monthly cost cap
files:
  - apps/api/src/main.ts
  - apps/api/src/composition.ts
  - apps/api/src/auth.ts
  - apps/api/src/routes/portal-routes.ts
  - apps/api/src/routes/console-routes.ts
  - apps/api/src/batch-runs.ts
  - apps/api/src/projects.ts
  - apps/api/src/task-export.ts
input: Environment and catalogs at boot; HTTP at runtime
output: A running platform on :8080
replaces:
  - module: api
    how: HTTP server and routing
  - module: setup
    how: Bootstrap and wiring
