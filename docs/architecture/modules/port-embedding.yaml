id: port-embedding
plane: ports
name: Embedding port
note: Text to vectors
icon: chart
color: '#74a7ff'
status: Port
packages:
  - '@genai/port-embedding'
summary: Turns text into vectors with the embedding models of the model catalogue.
description:
  Same router shape as the model and rerank ports. Its embedders are the models in the model
  catalogue that bind an API for embed (ADR 0048), so they change without a deploy. Checks dimensions, batches input and calls
  through the kernel's gate (ADR 0047), which checks tenant sharing and residency, holds the
  texts and vectors to their closed shape, masks, meters and audits, also for ingestion and search
  outside a run, so search engines without built-in embedding can use vectors. Embedding is open in
  lockdown, as ADR 0033 intends.
responsibilities:
  - Embedding models from the model catalogue, by API id
  - Dimension checks and batching
  - Calls through the kernel gate, which applies the endpoint's egress guard
  - A 429's requested wait on the error (retryAfterMs), and the SDK's retries per opened embedder
files:
  - packages/port-embedding/src/port.ts
  - packages/port-embedding/src/router.ts
  - packages/port-embedding/src/catalog.ts
input: Texts
output: Vectors
replaces:
  - module: rag
    how: Embedding inside Typesense
edges:
  - to: operations
    label: Descriptor executor and registry
    kind: call
    target: call
    witness:
      file: packages/port-embedding/src/router.ts
      imports: '@genai/operations'
  - to: plugins
    label: Embedding contract suite
    kind: call
    target: call
    witness:
      file: packages/port-embedding/src/contract.ts
      imports: '@genai/plugins'
  - to: kernel
    label: 'Kernel SPI: tasks, events, principals, capabilities'
    kind: call
    target: call
    witness:
      file: packages/port-embedding/src/adapter.ts
      imports: '@genai/kernel'
contract:
  - name: embedding model
    file: packages/port-embedding/src/catalog.ts
    export: embeddingModel
keywords: embedding port vectors catalogue openai/embeddings@1
