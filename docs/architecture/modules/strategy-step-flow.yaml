id: strategy-step-flow
plane: runtime
name: Step flows
note: Versioned, reusable flows
icon: graph
color: '#4ad3bb'
status: Strategy plugin
packages:
  - '@genai/strategy-step-flow'
summary: 'Runs StepFlow definitions: blocks, repeat, forEach, switchOn and subflows.'
description: A step has exactly one action and an onError policy (ADR 0007). Built-in blocks call
  models, classify, extract with cited sources, read facet values, retrieve, list and read documents, build tables with a
  source per cell, route, ask for approval, run the agent loop or call a tool from a registered tool
  source.
responsibilities:
  - Execute versioned step flows
  - Built-in blocks and expressions
  - Validate flows at publish
files:
  - packages/strategy-step-flow/src/runtime.ts
  - packages/strategy-step-flow/src/blocks.ts
  - packages/strategy-step-flow/src/builtins.ts
  - packages/strategy-step-flow/src/validate.ts
  - packages/strategy-step-flow/src/blocks/facets.ts
  - packages/strategy-step-flow/src/blocks/documents.ts
  - packages/strategy-step-flow/src/blocks/table.ts
  - packages/strategy-step-flow/src/blocks/tools.ts
input: Flow ref + input
output: Flow result
replaces:
  - module: skills
    how: Composable graph execution, as declarative flows
edges:
  - to: plugins
    label: Step-block contract suite
    kind: call
    target: call
    witness:
      file: packages/strategy-step-flow/src/contract.ts
      imports: '@genai/plugins'
  - to: definitions
    label: Definitions, settings and the definition store
    kind: call
    target: call
    witness:
      file: packages/strategy-step-flow/src/runtime.ts
      imports: '@genai/definitions'
  - to: kernel
    label: 'Kernel SPI: tasks, events, principals, capabilities'
    kind: call
    target: call
    witness:
      file: packages/strategy-step-flow/src/blocks/control.ts
      imports: '@genai/contracts'
  - to: port-model
    label: Model calls through the model port
    kind: call
    target: call
    witness:
      file: packages/strategy-step-flow/src/blocks/model.ts
      imports: '@genai/port-model'
  - to: port-tools
    label: Tool calls through the tool port
    kind: call
    target: call
    witness:
      file: packages/strategy-step-flow/src/blocks/tools.ts
      imports: '@genai/port-tools'
contract:
  - name: config
    file: packages/strategy-step-flow/src/runtime.ts
    export: stepFlowConfig
keywords: step flow graph blocks workflow
