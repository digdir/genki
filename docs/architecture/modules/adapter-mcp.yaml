id: adapter-mcp
plane: adapters
name: MCP adapter
note: JSON-RPC tools over HTTP
icon: gateway
color: '#46d7c8'
status: Protocol adapter
packages:
  - '@genai/adapter-mcp'
summary: Exposes published service variants as MCP tools, with the headers, errors and progress KA expects.
description: 'Implements the current MCP revision on /api/mcp: discovery, tools/list and tools/call,
  SSE progress and the three result channels. Each tool is a capability invoked through the kernel;
  bodies over 1 MiB are refused (ADR 0017). Every tools/call checks the monthly token quota and
  answers 429 with a JSON-RPC quota-exhausted error once it is used.'
responsibilities:
  - MCP protocol handling and version negotiation
  - Map tools to capabilities and invoke them via the kernel
  - Stream progress and structured results
files:
  - packages/adapter-mcp/src/app.ts
  - packages/adapter-mcp/src/tools.ts
  - packages/adapter-mcp/src/protocol.ts
  - packages/adapter-mcp/src/progress.ts
input: JSON-RPC tools/call
output: Tool result with structuredContent
replaces:
  - module: mcp
    how: Same tool names and wire behaviour, minus ping and unbounded bodies
edges:
  - to: kernel
    label: 'Kernel SPI: tasks, events, principals, capabilities'
    kind: call
    target: call
    witness:
      file: packages/adapter-mcp/src/app.ts
      imports: '@genai/contracts'
keywords: mcp json-rpc tools call gateway sse
