id: providers-parquet
plane: providers
name: Parquet reader
note: File decoder
icon: database
color: '#8fa8b3'
status: Provider
packages:
  - '@genai/providers-parquet'
summary: Decodes Parquet files for pipelines with a parquet source.
description: Implements the Parquet reader of the parquet source (ADR 0039) with hyparquet and
  hyparquet-compressors, JavaScript with embedded WebAssembly for Snappy and no platform-specific
  native binaries. It lists a file's columns, so the
  source can name the mapped columns a file lacks, and reads only the mapped columns, in steps,
  up to the pipeline's row limit. Lists stay lists and nulls stay null. The ingestion fetches the
  bytes through its guarded fetch before the reader sees them.
responsibilities:
  - Column listing
  - Row reads of the mapped columns with a row limit
  - Snappy, gzip, ZSTD, Brotli and LZ4 pages
files:
  - packages/providers-parquet/src/reader.ts
input: Parquet file bytes, columns, row limit
output: Rows
replaces: []
edges:
  - to: ingest
    label: Implements the Parquet reader of the parquet source
    kind: call
    target: call
    witness:
      file: packages/providers-parquet/src/reader.ts
      imports: '@genai/ingest'
keywords: parquet hugging face open data file reader hyparquet
