id: composition
plane: composition
name: Composition
note: Shared kernel wiring
icon: network
color: '#a78bfa'
status: Library
packages:
  - '@genai/composition'
summary: Builds the kernel and its registries from config and stores, for the API and the worker alike.
description: One runtime builder that both composition roots call. It builds the model, knowledge,
  rerank, embedding and tool routers, wraps every service strategy in settings, guardrails, hooks and
  document scope, applies the catalogs stored as config entries, compiles published services into
  capabilities with the platform cost limits and quarantines the ones that fail. The API adds HTTP,
  admin modules and platform strategies on top; the worker runs triggers on the same kernel.
responsibilities:
  - Build routers, ports, strategies, registry and kernel from catalogs, secrets and stores
  - Wrap every service strategy in settings, guardrails, hooks and document scope
  - Apply catalogs, guardrail rules, hooks and skills stored as config entries
  - Compile published services into capabilities and quarantine invalid ones
  - Apply per-agency building-block settings (on/off, timeouts) to every service run, in the API and the worker
  - Keep the config entry store, tenant secret vault and change feed contracts
files:
  - packages/composition/src/runtime.ts
  - packages/composition/src/block-settings.ts
  - packages/composition/src/catalog-registry.ts
  - packages/composition/src/config-store.ts
  - packages/composition/src/hook-runtime.ts
  - packages/composition/src/settings-runtime.ts
  - packages/composition/src/document-scope.ts
  - packages/composition/src/boot-guard.ts
input: Catalogs, secrets, definition and config stores, policy
output: A kernel with every strategy registered, and the registries behind it
replaces: []
