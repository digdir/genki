id: jobs
plane: services
name: Jobs & triggers
note: Cron · queue · batch
icon: pipeline
color: '#70d6a1'
status: Library + strategy
packages:
  - '@genai/jobs'
summary: Triggers that start services by themselves, and a batch strategy over blob folders.
description: Schedules (cron), queue messages and document arrival bind to services through
  `triggers` in the definition. The batch strategy fans a service out over many inputs and scores
  the results.
responsibilities:
  - Cron and queue scheduling
  - Trigger bindings from definitions
  - Batch fan-out and scoring
  - Nightly purge of expired task content and envelopes (ADR 0011)
files:
  - packages/jobs/src/triggers.ts
  - packages/jobs/src/trigger-runs.ts
  - packages/jobs/src/quota.ts
  - packages/jobs/src/retention.ts
  - packages/jobs/src/trace-deliveries.ts
  - packages/jobs/src/retention-policy.ts
  - packages/jobs/src/batch.ts
  - packages/jobs/src/scheduler.ts
  - packages/jobs/src/cron.ts
input: Triggers + inputs
output: Tasks and batch results
replaces: []
edges:
  - to: definitions
    label: Definitions, settings and the definition store
    kind: call
    target: call
    witness:
      file: packages/jobs/src/triggers.ts
      imports: '@genai/definitions'
  - to: eval
    label: Evaluators and scoring
    kind: call
    target: call
    witness:
      file: packages/jobs/src/evaluators.ts
      imports: '@genai/eval'
  - to: kernel
    label: 'Kernel SPI: tasks, events, principals, capabilities'
    kind: call
    target: call
    witness:
      file: packages/jobs/src/batch.ts
      imports: '@genai/contracts'
  - to: port-blob
    label: Files for batch input and output
    kind: call
    target: call
    witness:
      file: packages/jobs/src/batch.ts
      imports: '@genai/port-blob'
contract:
  - name: batch config
    file: packages/jobs/src/batch.ts
    export: batchConfig
keywords: jobs triggers cron queue batch schedule
