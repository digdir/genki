id: providers-langfuse
plane: providers
name: Langfuse exporter
note: Metadata-only traces
icon: pulse
color: '#8fa8b3'
status: Provider
packages:
  - '@genai/providers-langfuse'
summary: Exports task events as OTLP spans to Langfuse, metadata only unless opted in.
description: Wraps the event log; content (the question, the answer and the sources it cites) goes
  out only if the connection opts in and the sink can honour erasure (ADR 0011). A test run is sent
  as one Langfuse experiment, one item per case (ADR 0003).
responsibilities:
  - Build spans from events
  - Export with content opt-in
  - Send test runs as experiments
files:
  - packages/providers-langfuse/src/exporter.ts
  - packages/providers-langfuse/src/spans.ts
  - packages/providers-langfuse/src/experiment.ts
input: Kernel events
output: OTLP spans
replaces:
  - module: telemetry
    how: Tracing
edges:
  - to: kernel
    label: 'Kernel SPI: tasks, events, principals, capabilities'
    kind: call
    target: call
    witness:
      file: packages/providers-langfuse/src/config.ts
      imports: '@genai/kernel'
  - to: langfuse
    label: OTLP span export
    kind: http
    target: http
    witness:
      file: packages/providers-langfuse/src/exporter.ts
      contains: await send(url
contract:
  - name: exporter
    file: packages/providers-langfuse/src/config.ts
    export: exporterConfig
keywords: langfuse tracing otlp telemetry
