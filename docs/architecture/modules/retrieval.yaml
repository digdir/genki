id: retrieval
plane: services
name: Retrieval pipeline
note: Plan · search · merge · rerank
icon: search
color: '#70d6a1'
status: Library
packages:
  - '@genai/retrieval'
summary: The headless-rag retrieval behaviour as composable stages over the knowledge, rerank and
  model ports.
description: Query planning, auto-filter rules, multi-strategy search, merge and optional rerank,
  parity-tested against headless-rag. Strategies get it injected by the composition root.
responsibilities:
  - Query planning and auto filters
  - Multi-strategy search and merge
  - Rerank and context selection
files:
  - packages/retrieval/src/pipeline.ts
  - packages/retrieval/src/planner.ts
  - packages/retrieval/src/merge.ts
  - packages/retrieval/src/factories.ts
input: Question + retrieval config
output: Ranked hits
replaces:
  - module: rag
    how: Retrieval, filters, query relaxation and rerank
edges:
  - to: port-knowledge
    label: Search and fetch through the knowledge port
    kind: call
    target: call
    witness:
      file: packages/retrieval/src/factories.ts
      imports: '@genai/port-knowledge'
  - to: port-model
    label: Model calls through the model port
    kind: call
    target: call
    witness:
      file: packages/retrieval/src/factories.ts
      imports: '@genai/port-model'
  - to: port-rerank
    label: Rerank through the rerank port
    kind: call
    target: call
    witness:
      file: packages/retrieval/src/factories.ts
      imports: '@genai/port-rerank'
contract:
  - name: config
    file: packages/retrieval/src/config.ts
    export: retrievalConfig
keywords: retrieval search merge rerank planner filters
