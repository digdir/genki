id: providers-pgboss
plane: providers
name: pg-boss job queue
note: Durable jobs in Postgres
icon: database
color: '#8fa8b3'
status: Provider
packages:
  - '@genai/providers-pgboss'
summary: The durable job queue behind the JobQueue port, on pg-boss in schema pgboss.
description:
  The owner role installs and migrates schema pgboss and creates the queues; the worker sends
  and works as genai_worker with migrate and createSchema off. Of the roles the apps run as, only
  the worker's (genai_worker, or genai_knowledge_writer on the knowledge server) can read or
  change the job tables; genai_runtime may send jobs on the platform server, for the knowledge
  queues, but not read, change or delete one. Jobs are sent in the caller's transaction. Counts and dead letters can be read
  only through functions that need platform access, with PgBossJobReads, for the console screen
  still to come (ADR 0041). PgBossRunJobs finds, cancels and sends back a run's jobs for the
  knowledge reconciler (ADR 0042).
responsibilities:
  - Install, migrate and grant schema pgboss
  - Send, work, schedule, cancel and redrive jobs
  - Queue counts and dead letters behind platform access
  - A run's jobs on one server, for the reconciler
files:
  - packages/providers-pgboss/src/index.ts
input: Job queue calls
output: SQL
edges:
  - to: jobs
    label: Implements the JobQueue port
    kind: call
    target: call
    witness:
      file: packages/providers-pgboss/src/index.ts
      imports: '@genai/jobs'
  - to: postgres-db
    label: Jobs in schema pgboss over the platform's pools
    kind: sql
    target: sql
    witness:
      file: packages/providers-pgboss/src/index.ts
      contains: pg-boss
keywords: pg-boss jobs queue durable dead letter
