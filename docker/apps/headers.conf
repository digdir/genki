add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://altinncdn.no; font-src 'self' https://altinncdn.no; img-src 'self' data: blob:; connect-src __CONNECT_SRC__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
