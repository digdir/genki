<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <title>Minimal frontend</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 44rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      #answer {
        white-space: pre-wrap;
        margin: 1rem 0;
      }
      li {
        margin-bottom: 0.5rem;
      }
      small {
        color: #555;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Minimal frontend</h1>
    <form id="form">
      <select id="service" aria-label="Service"></select>
      <input id="question" aria-label="Question" size="40" required />
      <button>Ask</button>
    </form>
    <p><small>Answers are generated by AI.</small></p>
    <div id="answer" aria-live="polite"></div>
    <ol id="sources"></ol>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      let conversationId;

      const services = await (await fetch('/api/services')).json();
      $('service').innerHTML = services
        .map((s) => `<option value="${s.id}">${s.title ?? s.id}</option>`)
        .join('');

      $('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        $('answer').textContent = '';
        $('sources').innerHTML = '';
        const response = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            service: $('service').value,
            question: $('question').value,
            conversationId,
          }),
        });
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          for (let end; (end = buffer.indexOf('\n\n')) >= 0;) {
            const event = JSON.parse(buffer.slice(0, end).slice(6));
            buffer = buffer.slice(end + 2);
            if (event.type === 'conversation') conversationId = event.conversationId;
            else if (event.type === 'text') $('answer').textContent += event.text;
            else if (event.type === 'retract') $('answer').textContent = '';
            else if (event.type === 'error') $('answer').textContent = event.message;
            else if (event.type === 'done') showSources(event.answer.sources);
          }
        }
      });

      const showSources = (sources) => {
        for (const source of sources) {
          const item = document.createElement('li');
          item.value = source.index ?? 0;
          const title = source.url
            ? Object.assign(document.createElement('a'), {
                href: source.url,
                textContent: source.title,
              })
            : document.createTextNode(source.title);
          item.append(title);
          for (const excerpt of source.excerpts.slice(0, 2)) {
            const text = document.createElement('small');
            text.textContent = excerpt.text.slice(0, 200);
            item.append(text);
          }
          $('sources').append(item);
        }
      };
    </script>
  </body>
</html>
