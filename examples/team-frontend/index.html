<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team frontend</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <h1>Team frontend</h1>
      <span id="who"></span>
      <button id="login" type="button" hidden>Log in</button>
      <button id="logout" type="button" hidden>Log out</button>
    </header>
    <p id="status" role="status"></p>
    <main id="chat" hidden>
      <nav aria-label="Threads">
        <button id="new" type="button">New thread</button>
        <ul id="threads"></ul>
      </nav>
      <section>
        <form id="ask">
          <select id="service" aria-label="Service"></select>
          <input id="question" aria-label="Question" required />
          <button>Ask</button>
        </form>
        <p><small>Answers are generated by AI.</small></p>
        <div id="answer" aria-live="polite"></div>
        <ol id="sources" aria-label="Sources"></ol>
      </section>
    </main>
  </body>
</html>
