name: infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [test]
        default: test
      what-if:
        description: Only show what would change
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      PG_ADMIN_GROUP_OBJECT_ID: ${{ vars.PG_ADMIN_GROUP_OBJECT_ID }}
      PG_ADMIN_GROUP_NAME: ${{ vars.PG_ADMIN_GROUP_NAME }}
      DEPLOY_PRINCIPAL_ID: ${{ vars.DEPLOY_PRINCIPAL_ID }}
      ANSATTPORTEN_ISSUER: ${{ vars.ANSATTPORTEN_ISSUER }}
      ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
      ALTINN_PDP_MASKINPORTEN_CLIENT_ID: ${{ vars.ALTINN_PDP_MASKINPORTEN_CLIENT_ID }}
      MASKINPORTEN_ISSUER: ${{ vars.MASKINPORTEN_ISSUER }}
      MASKINPORTEN_TOKEN_URL: ${{ vars.MASKINPORTEN_TOKEN_URL }}
      OPERATOR_SUBJECTS: ${{ vars.OPERATOR_SUBJECTS }}
      PORTAL_CLIENT_ID: ${{ vars.PORTAL_CLIENT_ID }}
      WORKSPACE_CLIENT_ID: ${{ vars.WORKSPACE_CLIENT_ID }}
      CONSOLE_CLIENT_ID: ${{ vars.CONSOLE_CLIENT_ID }}
      CONSOLE_TOKEN_ENDPOINT: ${{ vars.CONSOLE_TOKEN_ENDPOINT }}
      CUSTOM_DOMAINS_STAGE: ${{ vars.CUSTOM_DOMAINS_STAGE }}
      FOUNDRY_OPENAI_BASE_URL: ${{ vars.FOUNDRY_OPENAI_BASE_URL }}
      FOUNDRY_CLAUDE_BASE_URL: ${{ vars.FOUNDRY_CLAUDE_BASE_URL }}
      TYPESENSE_URL: ${{ vars.TYPESENSE_URL }}
      COLBERT_API_URL: ${{ vars.COLBERT_API_URL }}
      PLATFORM_TENANT: ${{ vars.PLATFORM_TENANT }}
      ALTINN_RESOURCE: ${{ vars.ALTINN_RESOURCE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: current
        run: |
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          placeholder=mcr.microsoft.com/k8se/quickstart:latest
          image_of() {
            app=$(az containerapp list -g "$rg" --query "[?ends_with(name, '-$1')].name | [0]" -o tsv)
            if [ -n "$app" ]; then
              az containerapp show -g "$rg" -n "$app" --query 'properties.template.containers[0].image' -o tsv
            else
              echo "$placeholder"
            fi
          }
          {
            echo "api=$(image_of api)"
            echo "worker=$(image_of worker)"
            echo "apps=$(image_of portal)"
          } >> "$GITHUB_OUTPUT"
          api=$(az containerapp list -g "$rg" --query "[?ends_with(name, '-api')].name | [0]" -o tsv)
          if [ -n "$api" ]; then
            echo "version=$(az containerapp show -g "$rg" -n "$api" --query "properties.template.containers[0].env[?name=='APP_VERSION'].value | [0]" -o tsv)" >> "$GITHUB_OUTPUT"
          else
            echo "version=bootstrap" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          az deployment group ${{ inputs.what-if && 'what-if' || 'create' }} \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "infra-${{ github.run_id }}" \
            --parameters infra/env/${{ inputs.environment }}.bicepparam \
            --parameters apiImage="${{ steps.current.outputs.api }}" workerImage="${{ steps.current.outputs.worker }}" appsImage="${{ steps.current.outputs.apps }}" appVersion="${{ steps.current.outputs.version }}"
