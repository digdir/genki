name: demo-recorder

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: demo-recorder-genki-test
  cancel-in-progress: false

jobs:
  queue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: genki-test
      deployment: false
    permissions:
      contents: read
    outputs:
      count: ${{ steps.list.outputs.count }}
    steps:
      - id: list
        env:
          DEMO_RECORDER_KEY: ${{ secrets.DEMO_RECORDER_KEY }}
          DEMO_API_URL: ${{ vars.SMOKE_API_URL || 'https://api.genki.digdir.cloud' }}
        run: |
          set -euo pipefail
          if [ -z "$DEMO_RECORDER_KEY" ]; then
            echo "DEMO_RECORDER_KEY is not set, so nothing is recorded."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(printf 'x-recorder-key: %s\n' "$DEMO_RECORDER_KEY" |
            curl --fail --silent --show-error --max-time 30 --header @- \
              "${DEMO_API_URL%/}/recorder/recordings?status=queued" | jq '.data | length')
          echo "$count queued"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - if: steps.list.outputs.count != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.list.outputs.count != '0'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - if: steps.list.outputs.count != '0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.list.outputs.count != '0'
        run: npm ci --no-audit --no-fund
      - if: steps.list.outputs.count != '0'
        env:
          DEMO_RECORDER_KEY: ${{ secrets.DEMO_RECORDER_KEY }}
          DEMO_API_URL: ${{ vars.SMOKE_API_URL || 'https://api.genki.digdir.cloud' }}
        run: node scripts/demo.ts queued
      - if: steps.list.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-queue
          path: demos/out/queued.json
          retention-days: 1

  voice:
    needs: queue
    if: needs.queue.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: smoke-review
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - if: vars.SPEECH_RESOURCE == ''
        run: echo "SPEECH_RESOURCE is not set, so the queued demos are recorded with subtitles only."
      - if: vars.SPEECH_RESOURCE != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: vars.SPEECH_RESOURCE != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-queue
          path: demos/out
      - if: vars.SPEECH_RESOURCE != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: demos/out/.voice
          key: demo-voice-queued-${{ hashFiles('demos/out/queued.json') }}
          restore-keys: demo-voice-
      - if: vars.SPEECH_RESOURCE != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_REVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_REVIEW_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_REVIEW_SUBSCRIPTION_ID }}
      - if: vars.SPEECH_RESOURCE != ''
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - if: vars.SPEECH_RESOURCE != ''
        run: npm ci --no-audit --no-fund
      - if: vars.SPEECH_RESOURCE != ''
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - if: vars.SPEECH_RESOURCE != ''
        env:
          SPEECH_RESOURCE: ${{ vars.SPEECH_RESOURCE }}
          SPEECH_RESOURCE_GROUP: ${{ vars.SPEECH_RESOURCE_GROUP }}
          SPEECH_SUBSCRIPTION: ${{ vars.SPEECH_SUBSCRIPTION || vars.AZURE_REVIEW_SUBSCRIPTION_ID }}
          DEMO_AUDIO_ENDPOINT: ${{ vars.DEMO_AUDIO_ENDPOINT }}
          DEMO_ELEVENLABS_KEY_SECRET: ${{ vars.DEMO_ELEVENLABS_KEY_SECRET }}
        run: node scripts/demo.ts voice --queued
      - if: ${{ !cancelled() && vars.SPEECH_RESOURCE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-voice
          path: |
            demos/out/.voice/*.mp3
            demos/out/.voice/*.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

  record:
    needs: [queue, voice]
    if: always() && needs.queue.result == 'success' && needs.queue.outputs.count != '0' && needs.voice.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: genki-test
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - run: npm install --global --no-audit --no-fund agent-browser@0.42.0
      - run: agent-browser install --with-deps
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-queue
          path: demos/out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.voice.result == 'success' || needs.voice.result == 'failure'
        continue-on-error: true
        with:
          name: demo-voice
          path: demos/out/.voice
      - if: vars.DEMO_DIRECTOR_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.DEMO_DIRECTOR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_REVIEW_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_REVIEW_SUBSCRIPTION_ID }}
      - env:
          DEMO_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          DEMO_RECORDER_KEY: ${{ secrets.DEMO_RECORDER_KEY }}
          DEMO_API_URL: ${{ vars.SMOKE_API_URL || 'https://api.genki.digdir.cloud' }}
          DEMO_PORTAL_URL: ${{ vars.SMOKE_PORTAL_URL }}
          DEMO_CONSOLE_URL: ${{ vars.SMOKE_CONSOLE_URL }}
          DEMO_AUDIO_ENDPOINT: ${{ vars.DEMO_DIRECTOR_CLIENT_ID != '' && vars.DEMO_AUDIO_ENDPOINT || '' }}
          DEMO_DIRECTOR_MODEL: ${{ vars.DEMO_DIRECTOR_MODEL }}
        run: node scripts/demo.ts recording --queued
