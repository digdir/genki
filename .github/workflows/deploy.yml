name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [test, prod]
        default: test
      infrastructure:
        description: Apply the whole template, even when infra/ and its settings have not changed since the last full deploy
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'test' }}
  cancel-in-progress: false

jobs:
  # Takes ci.yml's green run on this exact commit, from the merge queue or the push to main; `check` runs it otherwise.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      passed: ${{ steps.ci.outputs.passed }}
    steps:
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          state=none
          for round in $(seq 1 60); do
            state=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_sha == $ENV.SHA and .path == ".github/workflows/ci.yml")] |
                (map(select(.event == "push" and .head_branch == "main"))) as $push |
                if any(.[]; .event == "merge_group" and (.head_branch | startswith("gh-readonly-queue/main/")) and .conclusion == "success") then "queue"
                elif any($push[]; .conclusion == "success") then "success"
                elif any($push[]; .status != "completed") then "running"
                elif ($push | length) == 0 then "none" else "failure" end') || state=failure
            # A push run appears a few seconds after the merge, so a missing one is waited for for a minute.
            [ "$state" = running ] || { [ "$state" = none ] && [ "$round" -le 6 ]; } || break
            sleep 10
          done
          echo "The ci run on main for $SHA: $state"
          echo "passed=$([ "$state" = success ] || [ "$state" = queue ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  check:
    needs: ci
    if: needs.ci.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  # Reuses the images images.yml built and attested on the push to main; builds those missing.
  build:
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  candidate:
    needs: [ci, check, build]
    if: >-
      !cancelled() && needs.ci.result == 'success' && needs.build.result == 'success' &&
      (needs.ci.outputs.passed == 'true' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    permissions:
      contents: read
      id-token: write
    outputs:
      app: ${{ steps.plan.outputs.app }}
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      suffix: ${{ steps.plan.outputs.suffix }}
      live: ${{ steps.plan.outputs.live }}
      previous: ${{ steps.plan.outputs.previous }}
      revision: ${{ steps.deploy.outputs.revision }}
      url: ${{ steps.deploy.outputs.url }}
      infrastructure: ${{ steps.infra.outputs.infrastructure }}
    env:
      PG_ADMIN_GROUP_OBJECT_ID: ${{ vars.PG_ADMIN_GROUP_OBJECT_ID }}
      PG_ADMIN_GROUP_NAME: ${{ vars.PG_ADMIN_GROUP_NAME }}
      DEPLOY_PRINCIPAL_ID: ${{ vars.DEPLOY_PRINCIPAL_ID }}
      ANSATTPORTEN_ISSUER: ${{ vars.ANSATTPORTEN_ISSUER }}
      ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
      ALTINN_PDP_MASKINPORTEN_CLIENT_ID: ${{ vars.ALTINN_PDP_MASKINPORTEN_CLIENT_ID }}
      ALTINN_PEOPLE_URL: ${{ vars.ALTINN_PEOPLE_URL }}
      ALTINN_PEOPLE_MASKINPORTEN_CLIENT_ID: ${{ vars.ALTINN_PEOPLE_MASKINPORTEN_CLIENT_ID }}
      ALTINN_PEOPLE_MASKINPORTEN_SCOPE: ${{ vars.ALTINN_PEOPLE_MASKINPORTEN_SCOPE }}
      MASKINPORTEN_ISSUER: ${{ vars.MASKINPORTEN_ISSUER }}
      MASKINPORTEN_TOKEN_URL: ${{ vars.MASKINPORTEN_TOKEN_URL }}
      OPERATOR_SUBJECTS: ${{ vars.OPERATOR_SUBJECTS }}
      PORTAL_CLIENT_ID: ${{ vars.PORTAL_CLIENT_ID }}
      WORKSPACE_CLIENT_ID: ${{ vars.WORKSPACE_CLIENT_ID }}
      CONSOLE_CLIENT_ID: ${{ vars.CONSOLE_CLIENT_ID }}
      CONSOLE_TOKEN_ENDPOINT: ${{ vars.CONSOLE_TOKEN_ENDPOINT }}
      CUSTOM_DOMAINS_STAGE: ${{ vars.CUSTOM_DOMAINS_STAGE }}
      FOUNDRY_OPENAI_BASE_URL: ${{ vars.FOUNDRY_OPENAI_BASE_URL }}
      FOUNDRY_CLAUDE_BASE_URL: ${{ vars.FOUNDRY_CLAUDE_BASE_URL }}
      TYPESENSE_URL: ${{ vars.TYPESENSE_URL }}
      COLBERT_API_URL: ${{ vars.COLBERT_API_URL }}
      LANGFUSE_INSTANCE_RECEIVES_CONTENT: ${{ vars.LANGFUSE_INSTANCE_RECEIVES_CONTENT }}
      TRACES_ENDPOINT: ${{ vars.TRACES_ENDPOINT }}
      TRACES_RESIDENCY: ${{ vars.TRACES_RESIDENCY }}
      PLATFORM_TENANT: ${{ vars.PLATFORM_TENANT }}
      ALTINN_RESOURCE: ${{ vars.ALTINN_RESOURCE }}
      LOCKDOWN_ENTRA_GROUPS: ${{ vars.LOCKDOWN_ENTRA_GROUPS }}
      LOCKDOWN_USER_GROUPS: ${{ vars.LOCKDOWN_USER_GROUPS }}
      LOCKDOWN_SERVICE_GROUPS: ${{ vars.LOCKDOWN_SERVICE_GROUPS }}
      LOCKDOWN_SERVICE_CLIENT_IDS: ${{ vars.LOCKDOWN_SERVICE_CLIENT_IDS }}
      LOCKDOWN_ENTRA_EMAIL_DOMAIN: ${{ vars.LOCKDOWN_ENTRA_EMAIL_DOMAIN }}
      OPERATOR_CLIENT_IDS: ${{ vars.OPERATOR_CLIENT_IDS }}
      KNOWLEDGE_SERVER_STAGE: ${{ vars.KNOWLEDGE_SERVER_STAGE }}
      ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: plan
        run: |
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          placeholder=mcr.microsoft.com/k8se/quickstart:latest
          az containerapp list -g "$rg" -o json > apps.json
          # field <app name suffix> <jq path>: one value of the first app whose name ends with -<suffix>, or nothing.
          field() { jq -r --arg suffix "-$1" "first(.[] | select(.name | endswith(\$suffix)) | $2) // empty" apps.json; }
          version_of() { field "$1" '.properties.template.containers[0].env[]? | select(.name == "APP_VERSION") | .value'; }
          image_of() { local found; found=$(field "$1" '.properties.template.containers[0].image'); echo "${found:-$placeholder}"; }
          app=$(field api .name)
          image=$placeholder version=bootstrap suffix="" live="" previous=""
          if [ -n "$app" ]; then
            image=$(image_of api)
            version=$(version_of api)
            suffix=$(field api .properties.template.revisionSuffix)
            live=$(field api '.properties.configuration.ingress.traffic[]? | select(.weight == 100) | .revisionName')
            [ -n "$live" ] || live=$(field api .properties.latestReadyRevisionName)
            previous=$(field api '.properties.configuration.ingress.traffic[]? | select(.label == "previous") | .revisionName')
          fi
          if [ -n "$ALTINN_PDP_URL" ]; then
            image="${{ needs.build.outputs.api }}"
            version="${{ github.sha }}"
            suffix="r${{ github.run_id }}-${{ github.run_attempt }}"
          fi
          worker_version=$(version_of worker)
          {
            echo "app=$app"
            echo "worker_version=${worker_version:-bootstrap}"
            echo "image=$image"
            echo "version=${version:-bootstrap}"
            echo "suffix=$suffix"
            echo "live=$live"
            echo "previous=$previous"
            echo "worker=$(image_of worker)"
            echo "apps=$(image_of portal)"
            echo "docling=$(image_of docling)"
          } >> "$GITHUB_OUTPUT"
      - id: infra
        if: env.ALTINN_PDP_URL != ''
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          FORCE_INFRASTRUCTURE: ${{ inputs.infrastructure }}
        run: |
          state=$(scripts/infra-state.sh infra/env/test.bicepparam "$RG" "$FORCE_INFRASTRUCTURE")
          echo "$state" >> "$GITHUB_OUTPUT"
          echo "Candidate deploy applies the whole template: $(sed -n 's/^infrastructure=//p' <<< "$state")" >> "$GITHUB_STEP_SUMMARY"
      - id: deploy
        if: env.ALTINN_PDP_URL != ''
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "genki-${{ github.run_id }}-${{ github.run_attempt }}-candidate" \
            --parameters infra/env/test.bicepparam \
            --parameters apiImage="${{ steps.plan.outputs.image }}" apiRevisionSuffix="${{ steps.plan.outputs.suffix }}" apiLiveRevision="${{ steps.plan.outputs.live }}" apiPreviousRevision="${{ steps.plan.outputs.previous }}" workerImage="${{ steps.plan.outputs.worker }}" appsImage="${{ steps.plan.outputs.apps }}" doclingImage="${{ steps.plan.outputs.docling }}" appVersion="${{ steps.plan.outputs.version }}" workerVersion="${{ steps.plan.outputs.worker_version }}" \
              deployInfrastructure="${{ steps.infra.outputs.infrastructure }}" infraFingerprint="${{ steps.infra.outputs.fingerprint }}" \
            --query properties.outputs > outputs.json
          {
            echo "revision=$(jq -r .apiCandidateRevision.value outputs.json)"
            echo "url=$(jq -r .apiCandidateUrl.value outputs.json)"
          } >> "$GITHUB_OUTPUT"
      - name: candidate health
        if: steps.deploy.outcome == 'success'
        run: |
          for _ in $(seq 1 60); do
            body=$(curl -fsS --max-time 10 "${{ steps.deploy.outputs.url }}/health" || true)
            if echo "$body" | jq -e --arg v "${{ github.sha }}" '.version == $v and (.modelDiscovery.state // "ok") == "ok"' >/dev/null 2>&1; then echo "$body"; exit 0; fi
            sleep 5
          done
          echo "the candidate revision did not report ${{ github.sha }} with its models found: $body; users keep ${{ steps.plan.outputs.live }}"; exit 1
      - name: stop unused API revisions
        if: steps.deploy.outcome == 'success' && steps.plan.outputs.live != ''
        run: |
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          app="${{ steps.plan.outputs.app }}"
          keep=$(az containerapp ingress traffic show -g "$rg" -n "$app" --query '[].revisionName' -o tsv)
          echo "$keep" | grep -qx "${{ steps.plan.outputs.live }}" || exit 0
          for revision in $(az containerapp revision list -g "$rg" -n "$app" --query '[?properties.active].name' -o tsv); do
            echo "$keep" | grep -qx "$revision" || az containerapp revision deactivate -g "$rg" -n "$app" --revision "$revision"
          done
      - name: api skipped
        if: env.ALTINN_PDP_URL == ''
        run: |
          {
            echo "### API not deployed"
            echo
            echo "ALTINN_PDP_URL is not set in the test environment, and the API refuses to start without the real Altinn decision point. The worker and the apps are deployed; the API keeps its current image."
          } >> "$GITHUB_STEP_SUMMARY"

  # Later jobs name their needs' results, so a skipped `check` cannot skip the gate.
  gate:
    needs: candidate
    if: "!cancelled() && needs.candidate.result == 'success' && needs.candidate.outputs.url != ''"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: genki-test
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - id: run
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          SMOKE_API_URL: ${{ needs.candidate.outputs.url }}
          SMOKE_EXPECT_SHA: ${{ github.sha }}
          SMOKE_REVIEW: 'false'
          SMOKE_CAPPED: 'false'
          SMOKE_LANES: ${{ vars.SMOKE_LANES }}
          SMOKE_PORTAL_URL: ${{ vars.SMOKE_PORTAL_URL }}
          SMOKE_CONSOLE_URL: ${{ vars.SMOKE_CONSOLE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/smoke/run.ts
      - name: no failed check
        env:
          OUTCOME: ${{ steps.run.outputs.outcome }}
          MODELS: ${{ steps.run.outputs.models }}
          LIVE: ${{ needs.candidate.outputs.live }}
        run: |
          if [ "$OUTCOME" = fail ] || [ -z "$OUTCOME" ]; then
            echo "The smoke test failed on the candidate revision, so users keep $LIVE."
            exit 1
          fi
          if [ "$MODELS" != true ]; then
            echo "No model check ran on the candidate revision, so users keep $LIVE."
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-gate
          path: smoke-out
          retention-days: 30
          if-no-files-found: ignore

  discard:
    needs: [candidate, gate]
    if: >-
      always() && needs.candidate.outputs.revision != '' && needs.candidate.outputs.live != '' &&
      (needs.candidate.result == 'failure' || needs.gate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: stop the candidate that failed
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ needs.candidate.outputs.app }}
          CANDIDATE: ${{ needs.candidate.outputs.revision }}
          LIVE: ${{ needs.candidate.outputs.live }}
        run: |
          [ "$CANDIDATE" != "$LIVE" ] || exit 0
          az containerapp revision deactivate -g "$RG" -n "$APP" --revision "$CANDIDATE"
          {
            echo "### Candidate stopped"
            echo
            echo "\`$CANDIDATE\` failed its checks and is stopped, so it runs no schedules. Users keep \`$LIVE\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-test:
    needs: [build, candidate, gate]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.candidate.result == 'success' &&
      (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && needs.candidate.outputs.url == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: api
        env:
          LIVE: ${{ needs.candidate.outputs.live }}
          PREVIOUS: ${{ needs.candidate.outputs.previous }}
          CANDIDATE: ${{ needs.candidate.outputs.revision }}
        run: |
          if [ -n "$CANDIDATE" ] && [ -n "$LIVE" ]; then
            echo "live=$CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "previous=$LIVE" >> "$GITHUB_OUTPUT"
          else
            echo "live=$LIVE" >> "$GITHUB_OUTPUT"
            echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          fi
      - id: deploy
        env:
          FORCE_INFRASTRUCTURE: ${{ inputs.infrastructure && needs.candidate.outputs.infrastructure != 'true' }}
          PG_ADMIN_GROUP_OBJECT_ID: ${{ vars.PG_ADMIN_GROUP_OBJECT_ID }}
          PG_ADMIN_GROUP_NAME: ${{ vars.PG_ADMIN_GROUP_NAME }}
          DEPLOY_PRINCIPAL_ID: ${{ vars.DEPLOY_PRINCIPAL_ID }}
          ANSATTPORTEN_ISSUER: ${{ vars.ANSATTPORTEN_ISSUER }}
          ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
          ALTINN_PDP_MASKINPORTEN_CLIENT_ID: ${{ vars.ALTINN_PDP_MASKINPORTEN_CLIENT_ID }}
          ALTINN_PEOPLE_URL: ${{ vars.ALTINN_PEOPLE_URL }}
          ALTINN_PEOPLE_MASKINPORTEN_CLIENT_ID: ${{ vars.ALTINN_PEOPLE_MASKINPORTEN_CLIENT_ID }}
          ALTINN_PEOPLE_MASKINPORTEN_SCOPE: ${{ vars.ALTINN_PEOPLE_MASKINPORTEN_SCOPE }}
          MASKINPORTEN_ISSUER: ${{ vars.MASKINPORTEN_ISSUER }}
          MASKINPORTEN_TOKEN_URL: ${{ vars.MASKINPORTEN_TOKEN_URL }}
          OPERATOR_SUBJECTS: ${{ vars.OPERATOR_SUBJECTS }}
          PORTAL_CLIENT_ID: ${{ vars.PORTAL_CLIENT_ID }}
          WORKSPACE_CLIENT_ID: ${{ vars.WORKSPACE_CLIENT_ID }}
          CONSOLE_CLIENT_ID: ${{ vars.CONSOLE_CLIENT_ID }}
          CONSOLE_TOKEN_ENDPOINT: ${{ vars.CONSOLE_TOKEN_ENDPOINT }}
          CUSTOM_DOMAINS_STAGE: ${{ vars.CUSTOM_DOMAINS_STAGE }}
          FOUNDRY_OPENAI_BASE_URL: ${{ vars.FOUNDRY_OPENAI_BASE_URL }}
          FOUNDRY_CLAUDE_BASE_URL: ${{ vars.FOUNDRY_CLAUDE_BASE_URL }}
          TYPESENSE_URL: ${{ vars.TYPESENSE_URL }}
          COLBERT_API_URL: ${{ vars.COLBERT_API_URL }}
          LANGFUSE_INSTANCE_RECEIVES_CONTENT: ${{ vars.LANGFUSE_INSTANCE_RECEIVES_CONTENT }}
          TRACES_ENDPOINT: ${{ vars.TRACES_ENDPOINT }}
          TRACES_RESIDENCY: ${{ vars.TRACES_RESIDENCY }}
          PLATFORM_TENANT: ${{ vars.PLATFORM_TENANT }}
          ALTINN_RESOURCE: ${{ vars.ALTINN_RESOURCE }}
          LOCKDOWN_ENTRA_GROUPS: ${{ vars.LOCKDOWN_ENTRA_GROUPS }}
          LOCKDOWN_USER_GROUPS: ${{ vars.LOCKDOWN_USER_GROUPS }}
          LOCKDOWN_SERVICE_GROUPS: ${{ vars.LOCKDOWN_SERVICE_GROUPS }}
          LOCKDOWN_SERVICE_CLIENT_IDS: ${{ vars.LOCKDOWN_SERVICE_CLIENT_IDS }}
          LOCKDOWN_ENTRA_EMAIL_DOMAIN: ${{ vars.LOCKDOWN_ENTRA_EMAIL_DOMAIN }}
          OPERATOR_CLIENT_IDS: ${{ vars.OPERATOR_CLIENT_IDS }}
          KNOWLEDGE_SERVER_STAGE: ${{ vars.KNOWLEDGE_SERVER_STAGE }}
          ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
        run: |
          state=$(scripts/infra-state.sh infra/env/test.bicepparam "${{ vars.AZURE_RESOURCE_GROUP }}" "$FORCE_INFRASTRUCTURE")
          infrastructure=$(sed -n 's/^infrastructure=//p' <<< "$state")
          fingerprint=$(sed -n 's/^fingerprint=//p' <<< "$state")
          echo "Users' deploy applies the whole template: $infrastructure" >> "$GITHUB_STEP_SUMMARY"
          url=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "genki-${{ github.run_id }}-${{ github.run_attempt }}" \
            --parameters infra/env/test.bicepparam \
            --parameters deployInfrastructure="$infrastructure" infraFingerprint="$fingerprint" \
            --parameters apiImage="${{ needs.candidate.outputs.image }}" apiRevisionSuffix="${{ needs.candidate.outputs.suffix }}" apiLiveRevision="${{ steps.api.outputs.live }}" apiPreviousRevision="${{ steps.api.outputs.previous }}" workerImage="${{ needs.build.outputs.worker }}" appsImage="${{ needs.build.outputs.apps }}" doclingImage="${{ needs.build.outputs.docling }}" appVersion="${{ needs.candidate.outputs.version }}" \
            --query properties.outputs.apiUrl.value -o tsv)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: smoke
        if: needs.candidate.outputs.revision != ''
        run: |
          for _ in $(seq 1 60); do
            body=$(curl -fsS --max-time 10 "${{ steps.deploy.outputs.url }}/health" || true)
            if echo "$body" | jq -e --arg v "${{ github.sha }}" '.version == $v and (.modelDiscovery.state // "ok") == "ok"' >/dev/null 2>&1; then echo "$body"; exit 0; fi
            sleep 5
          done
          echo "health check did not report ${{ github.sha }} with its models found: $body; roll back with the rollback workflow"; exit 1
      - name: rollback note
        if: steps.api.outputs.previous != ''
        run: |
          {
            echo "### Rollback"
            echo
            echo "Users now get API revision \`${{ steps.api.outputs.live }}\`. \`${{ steps.api.outputs.previous }}\` keeps running with no traffic: \`gh workflow run rollback.yml\` moves users back to it."
          } >> "$GITHUB_STEP_SUMMARY"

  changelog:
    needs: deploy-test
    if: "!cancelled() && needs.deploy-test.result == 'success' && github.ref == 'refs/heads/main'"
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: smoke-review
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - id: login
        if: vars.AZURE_REVIEW_FOUNDRY_RESOURCE != ''
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_REVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_REVIEW_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_REVIEW_SUBSCRIPTION_ID }}
      - name: Collect the pull requests since the previous deploy and summarise them
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          FOUNDRY_RESOURCE: ${{ steps.login.outcome == 'success' && vars.AZURE_REVIEW_FOUNDRY_RESOURCE || '' }}
          MODEL: ${{ vars.DELIVERY_MODEL || vars.SMOKE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
        run: node scripts/delivery.ts collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-changelog
          path: delivery-out/changelog.json
          retention-days: 30
          if-no-files-found: ignore

  release:
    needs: [deploy-test, changelog]
    if: always() && github.ref == 'refs/heads/main' && needs.deploy-test.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: deploy-changelog
          path: delivery-out
      - name: Create the release for this deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/delivery.ts release

  deploy-prod:
    needs: [build, deploy-test]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.deploy-test.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && vars.PROD_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: required settings
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          ANSATTPORTEN_ISSUER: ${{ vars.ANSATTPORTEN_ISSUER }}
          ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
        run: |
          missing=""
          for name in ACR_NAME ANSATTPORTEN_ISSUER ALTINN_PDP_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "Not set in the prod environment:$missing"; exit 1; fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          SOURCE_REGISTRY: ${{ needs.build.outputs.registry }}
        run: |
          server=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          copy_image() {
            digest="${2#*@}"
            az acr import --name "$ACR_NAME" --registry "$SOURCE_REGISTRY" \
              --source "$1@$digest" --image "$1:${{ github.sha }}" --force
            echo "$3=$server/$1@$digest" >> "$GITHUB_OUTPUT"
          }
          copy_image genai-api "${{ needs.build.outputs.api }}" api
          copy_image genai-worker "${{ needs.build.outputs.worker }}" worker
          copy_image genai-apps "${{ needs.build.outputs.apps }}" apps
          copy_image genai-docling "${{ needs.build.outputs.docling }}" docling
      - id: deploy
        env:
          PG_ADMIN_GROUP_OBJECT_ID: ${{ vars.PG_ADMIN_GROUP_OBJECT_ID }}
          PG_ADMIN_GROUP_NAME: ${{ vars.PG_ADMIN_GROUP_NAME }}
          DEPLOY_PRINCIPAL_ID: ${{ vars.DEPLOY_PRINCIPAL_ID }}
          ANSATTPORTEN_ISSUER: ${{ vars.ANSATTPORTEN_ISSUER }}
          ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
          ALTINN_PDP_MASKINPORTEN_CLIENT_ID: ${{ vars.ALTINN_PDP_MASKINPORTEN_CLIENT_ID }}
          MASKINPORTEN_ISSUER: ${{ vars.MASKINPORTEN_ISSUER }}
          MASKINPORTEN_TOKEN_URL: ${{ vars.MASKINPORTEN_TOKEN_URL }}
          OPERATOR_SUBJECTS: ${{ vars.OPERATOR_SUBJECTS }}
          PORTAL_CLIENT_ID: ${{ vars.PORTAL_CLIENT_ID }}
          WORKSPACE_CLIENT_ID: ${{ vars.WORKSPACE_CLIENT_ID }}
          CONSOLE_CLIENT_ID: ${{ vars.CONSOLE_CLIENT_ID }}
          CONSOLE_TOKEN_ENDPOINT: ${{ vars.CONSOLE_TOKEN_ENDPOINT }}
          CUSTOM_DOMAINS_STAGE: ${{ vars.CUSTOM_DOMAINS_STAGE }}
          FOUNDRY_OPENAI_BASE_URL: ${{ vars.FOUNDRY_OPENAI_BASE_URL }}
          FOUNDRY_CLAUDE_BASE_URL: ${{ vars.FOUNDRY_CLAUDE_BASE_URL }}
          TYPESENSE_URL: ${{ vars.TYPESENSE_URL }}
          COLBERT_API_URL: ${{ vars.COLBERT_API_URL }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
          LANGFUSE_INSTANCE_RECEIVES_CONTENT: ${{ vars.LANGFUSE_INSTANCE_RECEIVES_CONTENT }}
          PLATFORM_TENANT: ${{ vars.PLATFORM_TENANT }}
          ALTINN_RESOURCE: ${{ vars.ALTINN_RESOURCE }}
          KNOWLEDGE_SERVER_STAGE: ${{ vars.KNOWLEDGE_SERVER_STAGE }}
          ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
        run: |
          url=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "genki-${{ github.run_id }}" \
            --parameters infra/env/prod.bicepparam \
            --parameters apiImage="${{ steps.image.outputs.api }}" workerImage="${{ steps.image.outputs.worker }}" appsImage="${{ steps.image.outputs.apps }}" doclingImage="${{ steps.image.outputs.docling }}" appVersion="${{ github.sha }}" \
            --query properties.outputs.apiUrl.value -o tsv)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: smoke
        run: |
          for _ in $(seq 1 60); do
            body=$(curl -fsS --max-time 10 "${{ steps.deploy.outputs.url }}/health" || true)
            if echo "$body" | jq -e --arg v "${{ github.sha }}" '.version == $v and (.modelDiscovery.state // "ok") == "ok"' >/dev/null 2>&1; then echo "$body"; exit 0; fi
            sleep 5
          done
          echo "health check did not report ${{ github.sha }} with its models found: $body"; exit 1
