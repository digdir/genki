name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [test, prod]
        default: test

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'test' }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    permissions:
      contents: read
      id-token: write
    outputs:
      api: ${{ steps.image.outputs.api }}
      worker: ${{ steps.image.outputs.worker }}
      apps: ${{ steps.image.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: registry
        run: |
          server=$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer -o tsv)
          echo "server=$server" >> "$GITHUB_OUTPUT"
          az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/setup-buildx-action@v3
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.server }}/genai-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.server }}/genai-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - id: apps
        uses: docker/build-push-action@v6
        with:
          context: .
          target: apps
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.server }}/genai-apps:${{ github.sha }}
          cache-from: type=gha,scope=apps
          cache-to: type=gha,mode=max,scope=apps
      - id: image
        run: |
          {
            echo "api=${{ steps.registry.outputs.server }}/genai-api@${{ steps.api.outputs.digest }}"
            echo "worker=${{ steps.registry.outputs.server }}/genai-worker@${{ steps.worker.outputs.digest }}"
            echo "apps=${{ steps.registry.outputs.server }}/genai-apps@${{ steps.apps.outputs.digest }}"
          } >> "$GITHUB_OUTPUT"

  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: api
        env:
          ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
        run: |
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          if [ -n "$ALTINN_PDP_URL" ]; then
            {
              echo "deploy=true"
              echo "image=${{ needs.build.outputs.api }}"
              echo "version=${{ github.sha }}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app=$(az containerapp list -g "$rg" --query "[?ends_with(name, '-api')].name | [0]" -o tsv)
          image=mcr.microsoft.com/k8se/quickstart:latest
          version=bootstrap
          if [ -n "$app" ]; then
            image=$(az containerapp show -g "$rg" -n "$app" --query 'properties.template.containers[0].image' -o tsv)
            version=$(az containerapp show -g "$rg" -n "$app" --query "properties.template.containers[0].env[?name=='APP_VERSION'].value | [0]" -o tsv)
          fi
          {
            echo "deploy=false"
            echo "image=$image"
            echo "version=${version:-bootstrap}"
          } >> "$GITHUB_OUTPUT"
      - id: deploy
        env:
          PG_ADMIN_GROUP_OBJECT_ID: ${{ vars.PG_ADMIN_GROUP_OBJECT_ID }}
          PG_ADMIN_GROUP_NAME: ${{ vars.PG_ADMIN_GROUP_NAME }}
          DEPLOY_PRINCIPAL_ID: ${{ vars.DEPLOY_PRINCIPAL_ID }}
          ANSATTPORTEN_ISSUER: ${{ vars.ANSATTPORTEN_ISSUER }}
          ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
          ALTINN_PDP_MASKINPORTEN_CLIENT_ID: ${{ vars.ALTINN_PDP_MASKINPORTEN_CLIENT_ID }}
          MASKINPORTEN_ISSUER: ${{ vars.MASKINPORTEN_ISSUER }}
          MASKINPORTEN_TOKEN_URL: ${{ vars.MASKINPORTEN_TOKEN_URL }}
          OPERATOR_SUBJECTS: ${{ vars.OPERATOR_SUBJECTS }}
          PORTAL_CLIENT_ID: ${{ vars.PORTAL_CLIENT_ID }}
          WORKSPACE_CLIENT_ID: ${{ vars.WORKSPACE_CLIENT_ID }}
          CONSOLE_CLIENT_ID: ${{ vars.CONSOLE_CLIENT_ID }}
          CONSOLE_TOKEN_ENDPOINT: ${{ vars.CONSOLE_TOKEN_ENDPOINT }}
          CUSTOM_DOMAINS_STAGE: ${{ vars.CUSTOM_DOMAINS_STAGE }}
          FOUNDRY_OPENAI_BASE_URL: ${{ vars.FOUNDRY_OPENAI_BASE_URL }}
          FOUNDRY_CLAUDE_BASE_URL: ${{ vars.FOUNDRY_CLAUDE_BASE_URL }}
          TYPESENSE_URL: ${{ vars.TYPESENSE_URL }}
          COLBERT_API_URL: ${{ vars.COLBERT_API_URL }}
          PLATFORM_TENANT: ${{ vars.PLATFORM_TENANT }}
          ALTINN_RESOURCE: ${{ vars.ALTINN_RESOURCE }}
        run: |
          url=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "genki-${{ github.run_id }}" \
            --parameters infra/env/test.bicepparam \
            --parameters apiImage="${{ steps.api.outputs.image }}" workerImage="${{ needs.build.outputs.worker }}" appsImage="${{ needs.build.outputs.apps }}" appVersion="${{ steps.api.outputs.version }}" \
            --query properties.outputs.apiUrl.value -o tsv)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: api skipped
        if: steps.api.outputs.deploy != 'true'
        run: |
          {
            echo "### API not deployed"
            echo
            echo "ALTINN_PDP_URL is not set in the test environment, and the API refuses to start without the real Altinn decision point. The worker and the apps were deployed; the API keeps its current image."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: smoke
        if: steps.api.outputs.deploy == 'true'
        run: |
          for _ in $(seq 1 20); do
            body=$(curl -fsS "${{ steps.deploy.outputs.url }}/health" || true)
            if echo "$body" | grep -q '"version":"${{ github.sha }}"'; then echo "$body"; exit 0; fi
            sleep 15
          done
          echo "health check did not report ${{ github.sha }}"; exit 1

  deploy-prod:
    needs: [build, deploy-test]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && vars.PROD_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: prod parameters exist
        run: test -f infra/env/prod.bicepparam || { echo "infra/env/prod.bicepparam is not written yet"; exit 1; }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - env:
          PG_ADMIN_GROUP_OBJECT_ID: ${{ vars.PG_ADMIN_GROUP_OBJECT_ID }}
          PG_ADMIN_GROUP_NAME: ${{ vars.PG_ADMIN_GROUP_NAME }}
          DEPLOY_PRINCIPAL_ID: ${{ vars.DEPLOY_PRINCIPAL_ID }}
          ANSATTPORTEN_ISSUER: ${{ vars.ANSATTPORTEN_ISSUER }}
          ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
          ALTINN_PDP_MASKINPORTEN_CLIENT_ID: ${{ vars.ALTINN_PDP_MASKINPORTEN_CLIENT_ID }}
          MASKINPORTEN_ISSUER: ${{ vars.MASKINPORTEN_ISSUER }}
          MASKINPORTEN_TOKEN_URL: ${{ vars.MASKINPORTEN_TOKEN_URL }}
          OPERATOR_SUBJECTS: ${{ vars.OPERATOR_SUBJECTS }}
          PORTAL_CLIENT_ID: ${{ vars.PORTAL_CLIENT_ID }}
          WORKSPACE_CLIENT_ID: ${{ vars.WORKSPACE_CLIENT_ID }}
          CONSOLE_CLIENT_ID: ${{ vars.CONSOLE_CLIENT_ID }}
          CONSOLE_TOKEN_ENDPOINT: ${{ vars.CONSOLE_TOKEN_ENDPOINT }}
          CUSTOM_DOMAINS_STAGE: ${{ vars.CUSTOM_DOMAINS_STAGE }}
          FOUNDRY_OPENAI_BASE_URL: ${{ vars.FOUNDRY_OPENAI_BASE_URL }}
          FOUNDRY_CLAUDE_BASE_URL: ${{ vars.FOUNDRY_CLAUDE_BASE_URL }}
          TYPESENSE_URL: ${{ vars.TYPESENSE_URL }}
          COLBERT_API_URL: ${{ vars.COLBERT_API_URL }}
          PLATFORM_TENANT: ${{ vars.PLATFORM_TENANT }}
          ALTINN_RESOURCE: ${{ vars.ALTINN_RESOURCE }}
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "genki-${{ github.run_id }}" \
            --parameters infra/env/prod.bicepparam \
            --parameters apiImage="${{ needs.build.outputs.api }}" workerImage="${{ needs.build.outputs.worker }}" appsImage="${{ needs.build.outputs.apps }}" appVersion="${{ github.sha }}"
