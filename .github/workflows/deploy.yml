name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [test, prod]
        default: test

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'test' }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    permissions:
      contents: read
      id-token: write
    outputs:
      registry: ${{ steps.registry.outputs.id }}
      api: ${{ steps.image.outputs.api }}
      worker: ${{ steps.image.outputs.worker }}
      apps: ${{ steps.image.outputs.apps }}
      docling: ${{ steps.image.outputs.docling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: registry
        run: |
          server=$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer -o tsv)
          id=$(az acr show --name "${{ vars.ACR_NAME }}" --query id -o tsv)
          {
            echo "server=$server"
            echo "id=$id"
          } >> "$GITHUB_OUTPUT"
          az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          outputs: type=image,push=true,oci-mediatypes=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.server }}/genai-api:${{ github.sha }}
      - id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          outputs: type=image,push=true,oci-mediatypes=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.server }}/genai-worker:${{ github.sha }}
      - id: apps
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: apps
          outputs: type=image,push=true,oci-mediatypes=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.server }}/genai-apps:${{ github.sha }}
      # The Docling server (docker/docling): docling-serve's image pinned by digest, plus Norwegian Tesseract data.
      - id: docling
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/docling
          outputs: type=image,push=true,oci-mediatypes=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.server }}/genai-docling:${{ github.sha }}
      - id: image
        env:
          SERVER: ${{ steps.registry.outputs.server }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          APPS_DIGEST: ${{ steps.apps.outputs.digest }}
          DOCLING_DIGEST: ${{ steps.docling.outputs.digest }}
        run: |
          {
            echo "api=$SERVER/genai-api@$API_DIGEST"
            echo "worker=$SERVER/genai-worker@$WORKER_DIGEST"
            echo "apps=$SERVER/genai-apps@$APPS_DIGEST"
            echo "docling=$SERVER/genai-docling@$DOCLING_DIGEST"
          } >> "$GITHUB_OUTPUT"
          row() {
            platform=$(docker buildx imagetools inspect --raw "$SERVER/genai-$1@$2" |
              jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
            echo "| genai-$1 | \`$2\` | \`$platform\` |"
          }
          {
            echo "### Images"
            echo
            echo "Built from ${{ github.sha }} with \`SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH\`. To check them against the source, see docs/security/README.md."
            echo
            echo "| Image | Deployed digest | linux/amd64 image digest |"
            echo "| --- | --- | --- |"
            row api "$API_DIGEST"
            row worker "$WORKER_DIGEST"
            row apps "$APPS_DIGEST"
            row docling "$DOCLING_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: api
        env:
          ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
        run: |
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          if [ -n "$ALTINN_PDP_URL" ]; then
            {
              echo "deploy=true"
              echo "image=${{ needs.build.outputs.api }}"
              echo "version=${{ github.sha }}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app=$(az containerapp list -g "$rg" --query "[?ends_with(name, '-api')].name | [0]" -o tsv)
          image=mcr.microsoft.com/k8se/quickstart:latest
          version=bootstrap
          if [ -n "$app" ]; then
            image=$(az containerapp show -g "$rg" -n "$app" --query 'properties.template.containers[0].image' -o tsv)
            version=$(az containerapp show -g "$rg" -n "$app" --query "properties.template.containers[0].env[?name=='APP_VERSION'].value | [0]" -o tsv)
          fi
          {
            echo "deploy=false"
            echo "image=$image"
            echo "version=${version:-bootstrap}"
          } >> "$GITHUB_OUTPUT"
      - id: deploy
        env:
          PG_ADMIN_GROUP_OBJECT_ID: ${{ vars.PG_ADMIN_GROUP_OBJECT_ID }}
          PG_ADMIN_GROUP_NAME: ${{ vars.PG_ADMIN_GROUP_NAME }}
          DEPLOY_PRINCIPAL_ID: ${{ vars.DEPLOY_PRINCIPAL_ID }}
          ANSATTPORTEN_ISSUER: ${{ vars.ANSATTPORTEN_ISSUER }}
          ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
          ALTINN_PDP_MASKINPORTEN_CLIENT_ID: ${{ vars.ALTINN_PDP_MASKINPORTEN_CLIENT_ID }}
          MASKINPORTEN_ISSUER: ${{ vars.MASKINPORTEN_ISSUER }}
          MASKINPORTEN_TOKEN_URL: ${{ vars.MASKINPORTEN_TOKEN_URL }}
          OPERATOR_SUBJECTS: ${{ vars.OPERATOR_SUBJECTS }}
          PORTAL_CLIENT_ID: ${{ vars.PORTAL_CLIENT_ID }}
          WORKSPACE_CLIENT_ID: ${{ vars.WORKSPACE_CLIENT_ID }}
          CONSOLE_CLIENT_ID: ${{ vars.CONSOLE_CLIENT_ID }}
          CONSOLE_TOKEN_ENDPOINT: ${{ vars.CONSOLE_TOKEN_ENDPOINT }}
          CUSTOM_DOMAINS_STAGE: ${{ vars.CUSTOM_DOMAINS_STAGE }}
          FOUNDRY_OPENAI_BASE_URL: ${{ vars.FOUNDRY_OPENAI_BASE_URL }}
          FOUNDRY_CLAUDE_BASE_URL: ${{ vars.FOUNDRY_CLAUDE_BASE_URL }}
          TYPESENSE_URL: ${{ vars.TYPESENSE_URL }}
          COLBERT_API_URL: ${{ vars.COLBERT_API_URL }}
          PLATFORM_TENANT: ${{ vars.PLATFORM_TENANT }}
          ALTINN_RESOURCE: ${{ vars.ALTINN_RESOURCE }}
          LOCKDOWN_ENTRA_GROUPS: ${{ vars.LOCKDOWN_ENTRA_GROUPS }}
          LOCKDOWN_USER_GROUPS: ${{ vars.LOCKDOWN_USER_GROUPS }}
          LOCKDOWN_ENTRA_EMAIL_DOMAIN: ${{ vars.LOCKDOWN_ENTRA_EMAIL_DOMAIN }}
          OPERATOR_CLIENT_IDS: ${{ vars.OPERATOR_CLIENT_IDS }}
          KNOWLEDGE_SERVER_STAGE: ${{ vars.KNOWLEDGE_SERVER_STAGE }}
          ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
        run: |
          url=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "genki-${{ github.run_id }}" \
            --parameters infra/env/test.bicepparam \
            --parameters apiImage="${{ steps.api.outputs.image }}" workerImage="${{ needs.build.outputs.worker }}" appsImage="${{ needs.build.outputs.apps }}" doclingImage="${{ needs.build.outputs.docling }}" appVersion="${{ steps.api.outputs.version }}" \
            --query properties.outputs.apiUrl.value -o tsv)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: api skipped
        if: steps.api.outputs.deploy != 'true'
        run: |
          {
            echo "### API not deployed"
            echo
            echo "ALTINN_PDP_URL is not set in the test environment, and the API refuses to start without the real Altinn decision point. The worker and the apps were deployed; the API keeps its current image."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: smoke
        if: steps.api.outputs.deploy == 'true'
        run: |
          for _ in $(seq 1 20); do
            body=$(curl -fsS "${{ steps.deploy.outputs.url }}/health" || true)
            if echo "$body" | grep -q '"version":"${{ github.sha }}"'; then echo "$body"; exit 0; fi
            sleep 15
          done
          echo "health check did not report ${{ github.sha }}"; exit 1

  changelog:
    needs: deploy-test
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: smoke-review
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - id: login
        if: vars.AZURE_REVIEW_FOUNDRY_RESOURCE != ''
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_REVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_REVIEW_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_REVIEW_SUBSCRIPTION_ID }}
      - name: Collect the pull requests since the previous deploy and summarise them
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          FOUNDRY_RESOURCE: ${{ steps.login.outcome == 'success' && vars.AZURE_REVIEW_FOUNDRY_RESOURCE || '' }}
          MODEL: ${{ vars.DELIVERY_MODEL || vars.SMOKE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
        run: node scripts/delivery.ts collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-changelog
          path: delivery-out/changelog.json
          retention-days: 30
          if-no-files-found: ignore

  release:
    needs: [deploy-test, changelog]
    if: always() && github.ref == 'refs/heads/main' && needs.deploy-test.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: deploy-changelog
          path: delivery-out
      - name: Create the release for this deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/delivery.ts release

  deploy-prod:
    needs: [build, deploy-test]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && vars.PROD_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: required settings
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          ANSATTPORTEN_ISSUER: ${{ vars.ANSATTPORTEN_ISSUER }}
          ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
        run: |
          missing=""
          for name in ACR_NAME ANSATTPORTEN_ISSUER ALTINN_PDP_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "Not set in the prod environment:$missing"; exit 1; fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          SOURCE_REGISTRY: ${{ needs.build.outputs.registry }}
        run: |
          server=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          copy_image() {
            digest="${2#*@}"
            az acr import --name "$ACR_NAME" --registry "$SOURCE_REGISTRY" \
              --source "$1@$digest" --image "$1:${{ github.sha }}" --force
            echo "$3=$server/$1@$digest" >> "$GITHUB_OUTPUT"
          }
          copy_image genai-api "${{ needs.build.outputs.api }}" api
          copy_image genai-worker "${{ needs.build.outputs.worker }}" worker
          copy_image genai-apps "${{ needs.build.outputs.apps }}" apps
          copy_image genai-docling "${{ needs.build.outputs.docling }}" docling
      - id: deploy
        env:
          PG_ADMIN_GROUP_OBJECT_ID: ${{ vars.PG_ADMIN_GROUP_OBJECT_ID }}
          PG_ADMIN_GROUP_NAME: ${{ vars.PG_ADMIN_GROUP_NAME }}
          DEPLOY_PRINCIPAL_ID: ${{ vars.DEPLOY_PRINCIPAL_ID }}
          ANSATTPORTEN_ISSUER: ${{ vars.ANSATTPORTEN_ISSUER }}
          ALTINN_PDP_URL: ${{ vars.ALTINN_PDP_URL }}
          ALTINN_PDP_MASKINPORTEN_CLIENT_ID: ${{ vars.ALTINN_PDP_MASKINPORTEN_CLIENT_ID }}
          MASKINPORTEN_ISSUER: ${{ vars.MASKINPORTEN_ISSUER }}
          MASKINPORTEN_TOKEN_URL: ${{ vars.MASKINPORTEN_TOKEN_URL }}
          OPERATOR_SUBJECTS: ${{ vars.OPERATOR_SUBJECTS }}
          PORTAL_CLIENT_ID: ${{ vars.PORTAL_CLIENT_ID }}
          WORKSPACE_CLIENT_ID: ${{ vars.WORKSPACE_CLIENT_ID }}
          CONSOLE_CLIENT_ID: ${{ vars.CONSOLE_CLIENT_ID }}
          CONSOLE_TOKEN_ENDPOINT: ${{ vars.CONSOLE_TOKEN_ENDPOINT }}
          CUSTOM_DOMAINS_STAGE: ${{ vars.CUSTOM_DOMAINS_STAGE }}
          FOUNDRY_OPENAI_BASE_URL: ${{ vars.FOUNDRY_OPENAI_BASE_URL }}
          FOUNDRY_CLAUDE_BASE_URL: ${{ vars.FOUNDRY_CLAUDE_BASE_URL }}
          TYPESENSE_URL: ${{ vars.TYPESENSE_URL }}
          COLBERT_API_URL: ${{ vars.COLBERT_API_URL }}
          PLATFORM_TENANT: ${{ vars.PLATFORM_TENANT }}
          ALTINN_RESOURCE: ${{ vars.ALTINN_RESOURCE }}
          KNOWLEDGE_SERVER_STAGE: ${{ vars.KNOWLEDGE_SERVER_STAGE }}
          ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
        run: |
          url=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "genki-${{ github.run_id }}" \
            --parameters infra/env/prod.bicepparam \
            --parameters apiImage="${{ steps.image.outputs.api }}" workerImage="${{ steps.image.outputs.worker }}" appsImage="${{ steps.image.outputs.apps }}" doclingImage="${{ steps.image.outputs.docling }}" appVersion="${{ github.sha }}" \
            --query properties.outputs.apiUrl.value -o tsv)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: smoke
        run: |
          for _ in $(seq 1 20); do
            body=$(curl -fsS "${{ steps.deploy.outputs.url }}/health" || true)
            if echo "$body" | grep -q '"version":"${{ github.sha }}"'; then echo "$body"; exit 0; fi
            sleep 15
          done
          echo "health check did not report ${{ github.sha }}"; exit 1
