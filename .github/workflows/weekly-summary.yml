name: weekly-summary

on:
  schedule:
    - cron: '0 11 * * 5'
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions: {}

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: smoke-review
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - id: due
        name: Run only the schedule that is 13:00 in Oslo
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/delivery.ts weekly-due
      - id: login
        if: steps.due.outputs.due == 'true' && vars.AZURE_REVIEW_FOUNDRY_RESOURCE != ''
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_REVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_REVIEW_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_REVIEW_SUBSCRIPTION_ID }}
      - name: Collect the deploys of the last seven days and summarise them
        if: steps.due.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOUNDRY_RESOURCE: ${{ steps.login.outcome == 'success' && vars.AZURE_REVIEW_FOUNDRY_RESOURCE || '' }}
          MODEL: ${{ vars.DELIVERY_MODEL || vars.SMOKE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
          WEEKLY_SERVICES: ${{ vars.WEEKLY_SERVICES || 'Kunnskapsassistenten=digdir/kunnskapsassistenten' }}
        run: node scripts/delivery.ts weekly-collect
      - if: steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-summary
          path: delivery-out/week.json
          retention-days: 30
          if-no-files-found: ignore

  post:
    needs: collect
    if: needs.collect.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: weekly-summary
          path: delivery-out
      - name: Post the weekly summary to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DEPLOY_CHANNEL: ${{ vars.SLACK_DEPLOY_CHANNEL }}
          SLACK_DEPLOY_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
        run: node scripts/delivery.ts weekly-post
