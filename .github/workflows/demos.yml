name: demos
run-name: demos ${{ inputs.demo || 'all' }}

on:
  workflow_dispatch:
    inputs:
      demo:
        description: One demo by file name without .yaml; empty records them all
        type: string
        default: ''
      narrate:
        description: Read the narration aloud (needs the speech settings)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: demos-genki-test
  cancel-in-progress: false

jobs:
  voice:
    if: github.ref == 'refs/heads/main' && inputs.narrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: smoke-review
    permissions:
      contents: read
      id-token: write
    steps:
      - if: vars.SPEECH_RESOURCE == ''
        run: echo "SPEECH_RESOURCE is not set, so the demos are recorded with subtitles only."
      - if: vars.SPEECH_RESOURCE != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: vars.SPEECH_RESOURCE != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: demos/out/.voice
          key: demo-voice-${{ hashFiles('demos/*.yaml') }}
          restore-keys: demo-voice-
      - if: vars.SPEECH_RESOURCE != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_REVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_REVIEW_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_REVIEW_SUBSCRIPTION_ID }}
      - if: vars.SPEECH_RESOURCE != ''
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - if: vars.SPEECH_RESOURCE != ''
        run: npm ci --no-audit --no-fund
      - if: vars.SPEECH_RESOURCE != ''
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - if: vars.SPEECH_RESOURCE != ''
        env:
          SPEECH_RESOURCE: ${{ vars.SPEECH_RESOURCE }}
          SPEECH_RESOURCE_GROUP: ${{ vars.SPEECH_RESOURCE_GROUP }}
          SPEECH_SUBSCRIPTION: ${{ vars.SPEECH_SUBSCRIPTION || vars.AZURE_REVIEW_SUBSCRIPTION_ID }}
        run: node scripts/demo.ts voice
      - if: vars.SPEECH_RESOURCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-voice
          path: demos/out/.voice/*.mp3
          include-hidden-files: true
          retention-days: 1

  record:
    needs: voice
    if: always() && needs.voice.result != 'cancelled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: genki-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - run: npm install --global --no-audit --no-fund agent-browser@0.42.0
      - run: agent-browser install --with-deps
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.voice.result == 'success'
        continue-on-error: true
        with:
          name: demo-voice
          path: demos/out/.voice
      - env:
          DEMO_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          DEMO_RECORDER_KEY: ${{ secrets.DEMO_RECORDER_KEY }}
          DEMO_API_URL: ${{ vars.SMOKE_API_URL }}
          DEMO_PORTAL_URL: ${{ vars.SMOKE_PORTAL_URL }}
          DEMO_CONSOLE_URL: ${{ vars.SMOKE_CONSOLE_URL }}
          DEMO_ONLY: ${{ inputs.demo }}
        run: node scripts/demo.ts record --only "$DEMO_ONLY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demos
          path: |
            demos/out/*/*.mp4
            demos/out/*/*.srt
            demos/out/*/failed-step-*.png
          retention-days: 30
          if-no-files-found: ignore
