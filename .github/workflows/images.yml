name: images

# Builds and attests the images when a commit lands on main; deploy.yml calls it to reuse them (infra/README.md).
on:
  push:
    branches: [main]
  workflow_call:
    outputs:
      registry:
        value: ${{ jobs.build.outputs.registry }}
      api:
        value: ${{ jobs.build.outputs.api }}
      worker:
        value: ${{ jobs.build.outputs.worker }}
      apps:
        value: ${{ jobs.build.outputs.apps }}
      docling:
        value: ${{ jobs.build.outputs.docling }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      registry: ${{ steps.registry.outputs.id }}
      api: ${{ steps.image.outputs.api }}
      worker: ${{ steps.image.outputs.worker }}
      apps: ${{ steps.image.outputs.apps }}
      docling: ${{ steps.image.outputs.docling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: registry
        run: |
          server=$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer -o tsv)
          id=$(az acr show --name "${{ vars.ACR_NAME }}" --query id -o tsv)
          {
            echo "server=$server"
            echo "id=$id"
          } >> "$GITHUB_OUTPUT"
          az acr login --name "${{ vars.ACR_NAME }}"
      # Reuses an image only when its signed build attestation is from this workflow on main; else it is built again.
      - id: have
        env:
          SERVER: ${{ steps.registry.outputs.server }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          digest() {
            docker buildx imagetools inspect "$SERVER/$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true
          }
          attested() {
            gh attestation verify "oci://$SERVER/$1" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/images.yml" \
              --source-ref refs/heads/main --deny-self-hosted-runners "${@:2}" > /dev/null 2>&1
          }
          reuse() {
            reused=""
            found=$(digest "$1")
            if [ -n "$found" ] && attested "${1%%:*}@$found" "${@:2}"; then reused=$found
            elif [ -n "$found" ]; then echo "::warning::$1 has no build attestation from images.yml on main, so it is built again."
            fi
          }
          # Docling's Debian packages come from live mirrors: the week in its tag rebuilds it weekly.
          docling_tag="tree-$(git rev-parse HEAD:docker/docling)-$(date -u +%G-W%V)"
          reuse "genai-api:$SHA" --source-digest "$SHA" && api=$reused
          reuse "genai-worker:$SHA" --source-digest "$SHA" && worker=$reused
          reuse "genai-apps:$SHA" --source-digest "$SHA" && apps=$reused
          reuse "genai-docling:$docling_tag" && docling=$reused
          {
            echo "api=$api"
            echo "worker=$worker"
            echo "apps=$apps"
            echo "docling_tag=$docling_tag"
            echo "docling=$docling"
          } >> "$GITHUB_OUTPUT"
      - if: steps.have.outputs.api == '' || steps.have.outputs.worker == '' || steps.have.outputs.apps == '' || steps.have.outputs.docling == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - id: api
        if: steps.have.outputs.api == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          outputs: type=image,push=true,oci-mediatypes=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.server }}/genai-api:${{ github.sha }}
      - if: steps.api.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.registry.outputs.server }}/genai-api
          subject-digest: ${{ steps.api.outputs.digest }}
      - id: worker
        if: steps.have.outputs.worker == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          outputs: type=image,push=true,oci-mediatypes=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.server }}/genai-worker:${{ github.sha }}
      - if: steps.worker.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.registry.outputs.server }}/genai-worker
          subject-digest: ${{ steps.worker.outputs.digest }}
      - id: apps
        if: steps.have.outputs.apps == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: apps
          outputs: type=image,push=true,oci-mediatypes=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.server }}/genai-apps:${{ github.sha }}
      - if: steps.apps.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.registry.outputs.server }}/genai-apps
          subject-digest: ${{ steps.apps.outputs.digest }}
      # The Docling server (docker/docling): the parser benchmark winner's Docling and Tesseract on Debian, packages locked.
      - id: docling
        if: steps.have.outputs.docling == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/docling
          outputs: type=image,push=true,oci-mediatypes=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.registry.outputs.server }}/genai-docling:${{ steps.have.outputs.docling_tag }}
      - if: steps.docling.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.registry.outputs.server }}/genai-docling
          subject-digest: ${{ steps.docling.outputs.digest }}
      - id: image
        env:
          SERVER: ${{ steps.registry.outputs.server }}
          API_DIGEST: ${{ steps.api.outputs.digest || steps.have.outputs.api }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest || steps.have.outputs.worker }}
          APPS_DIGEST: ${{ steps.apps.outputs.digest || steps.have.outputs.apps }}
          DOCLING_DIGEST: ${{ steps.docling.outputs.digest || steps.have.outputs.docling }}
          API_BUILT: ${{ steps.api.outputs.digest != '' }}
          WORKER_BUILT: ${{ steps.worker.outputs.digest != '' }}
          APPS_BUILT: ${{ steps.apps.outputs.digest != '' }}
          DOCLING_BUILT: ${{ steps.docling.outputs.digest != '' }}
          DOCLING_TAG: ${{ steps.have.outputs.docling_tag }}
        run: |
          {
            echo "api=$SERVER/genai-api@$API_DIGEST"
            echo "worker=$SERVER/genai-worker@$WORKER_DIGEST"
            echo "apps=$SERVER/genai-apps@$APPS_DIGEST"
            echo "docling=$SERVER/genai-docling@$DOCLING_DIGEST"
          } >> "$GITHUB_OUTPUT"
          row() {
            platform=$(docker buildx imagetools inspect --raw "$SERVER/genai-$1@$2" |
              jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
            from=$([ "$3" = true ] && echo "built in this run" || echo "reused, attestation verified")
            echo "| genai-$1 | \`$2\` | \`$platform\` | $from |"
          }
          {
            echo "### Images"
            echo
            echo "For ${{ github.sha }}; this run built with \`SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH\`, and genai-docling is tagged \`$DOCLING_TAG\`. To check them against the source, see docs/security/README.md."
            echo
            echo "| Image | Deployed digest | linux/amd64 image digest | Source |"
            echo "| --- | --- | --- | --- |"
            row api "$API_DIGEST" "$API_BUILT"
            row worker "$WORKER_DIGEST" "$WORKER_BUILT"
            row apps "$APPS_DIGEST" "$APPS_BUILT"
            row docling "$DOCLING_DIGEST" "$DOCLING_BUILT"
          } >> "$GITHUB_STEP_SUMMARY"
