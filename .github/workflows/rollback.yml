name: rollback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: move users to the previous API revision
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        shell: bash
        run: |
          previous=$(scripts/rollback-api.sh "$RG" | tail -n 1)
          [ -n "$previous" ] || { echo "The rollback named no revision."; exit 1; }
          app=$(az containerapp list -g "$RG" --query "[?ends_with(name, '-api')].name | [0]" -o tsv)
          traffic=$(az containerapp ingress traffic show -g "$RG" -n "$app" -o table)
          echo "$traffic"
          {
            echo "### API rolled back to \`$previous\`"
            echo
            echo '```'
            echo "$traffic"
            echo '```'
            echo
            echo "Running this workflow again moves users forward again."
          } >> "$GITHUB_STEP_SUMMARY"
