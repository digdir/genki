name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      static: ${{ steps.scope.outputs.static }}
      tests: ${{ steps.scope.outputs.tests }}
      size: ${{ steps.scope.outputs.size }}
      image: ${{ steps.scope.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: node scripts/ci-scope.ts ${BASE:+"$BASE"}

  static:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.prettierrc.json', '.prettierignore', '.editorconfig') }}-${{ github.sha }}
          restore-keys: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.prettierrc.json', '.prettierignore', '.editorconfig') }}-
      - run: npm run format:check -- --cache --cache-strategy content
      - run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - run: npm run quarantine:check --if-present
      - run: npm run flags:expired
        continue-on-error: true
      - if: needs.scope.outputs.static == 'true'
        run: npm run lint
      - if: needs.scope.outputs.static == 'true'
        run: npm run boundaries
      - if: needs.scope.outputs.static == 'true'
        run: npm run definitions:compat
      - if: needs.scope.outputs.static == 'true'
        run: npm run atlas:build -- --check
      - if: needs.scope.outputs.static == 'true' && (github.event.pull_request.base.sha || github.event.merge_group.base_sha)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          npm run api:compat -- "$BASE"

  typecheck:
    needs: scope
    if: needs.scope.outputs.static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - id: sources
        run: echo "hash=$(git ls-files -- 'packages/*/src/*' 'apps/*/src/*' | grep -Ev '\.test\.tsx?$' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            *.tsbuildinfo
            packages/*/*.tsbuildinfo
            apps/*/*.tsbuildinfo
            packages/*/dist
            apps/*/dist
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'packages/*/tsconfig.json', 'apps/*/tsconfig.json') }}-${{ steps.sources.outputs.hash }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'packages/*/tsconfig.json', 'apps/*/tsconfig.json') }}-${{ steps.sources.outputs.hash }}-
      - run: npm run typecheck

  test:
    needs: scope
    if: needs.scope.outputs.tests != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run --shard=${{ matrix.shard }}/6 --passWithNoTests
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'false'
          DEBUG_PRINT_LIMIT: '200000'

  size:
    needs: scope
    if: needs.scope.outputs.size == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - run: npm run size

  # genki's middleware in front of docling-serve (docker/docling/genki_busy.py, issue 922), with the versions the image
  # pins; the image build runs the same tests, but only on main.
  docling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          sed -e '/--hash=/d' -e 's/ \\$//' docker/docling/requirements.txt > "$RUNNER_TEMP/constraints.txt"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -c "$RUNNER_TEMP/constraints.txt" starlette httpx python-multipart
      - working-directory: docker/docling
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest test_busy'

  check:
    needs: [scope, static, typecheck, test, size, docling]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          STATIC: ${{ needs.static.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TYPECHECK_IN_SCOPE: ${{ needs.scope.outputs.static }}
          TEST: ${{ needs.test.result }}
          TESTS_IN_SCOPE: ${{ needs.scope.outputs.tests != 'none' }}
          SIZE: ${{ needs.size.result }}
          SIZE_IN_SCOPE: ${{ needs.scope.outputs.size }}
          DOCLING: ${{ needs.docling.result }}
        run: |
          passed() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" = false ]; }; }
          test "$SCOPE" = success && test "$STATIC" = success && passed "$TYPECHECK" "$TYPECHECK_IN_SCOPE" && passed "$TEST" "$TESTS_IN_SCOPE" && passed "$SIZE" "$SIZE_IN_SCOPE" && test "$DOCLING" = success

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only HEAD's history: the full fetch brings every branch, and one false positive there failed every pull request.
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..HEAD', github.event.pull_request.base.sha) || 'HEAD' }}
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --log-opts="$RANGE" --redact --verbose --no-banner --exit-code 1

  image:
    needs: scope
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          outputs: type=docker,oci-mediatypes=true,rewrite-timestamp=true
          tags: genai-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: apps
          outputs: type=docker,oci-mediatypes=true,rewrite-timestamp=true
          tags: genai-apps:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker/smoke.sh genai-api:ci genai-apps:ci
