title: Lag en tjeneste
language: nb-NO
voice: nb-NO-PernilleNeural
viewport: [1280, 720]
start: https://portal.genki-test.digdir.cloud/#/services/smoke/setup
signedIn: true
ready: Formål og målgruppe
steps:
  - say: Slik lager en virksomhet en ny KI-tjeneste i GenKI. Ny tjeneste åpner rett i Oppsett, det samme oppsettet som en publisert tjeneste har.
    hold: 1
  - say: Bare navn og formål må fylles ut. Resten har trygge standardvalg for modell, språk og vern, som dere kan endre senere.
    do:
      - [find, label, Formål, hover]
  - say: Venstre side viser hver del av oppsettet og hva som mangler før tjenesten kan publiseres.
    do:
      - [find, role, navigation, hover, --name, Deler av oppsettet]
  - say: Under Kilder velger dere datasettene tjenesten skal svare fra. Nettsider og egne dokumenter vises allerede her, men lagres ikke ennå. De er merket med kommer senere.
    do:
      - [open, https://portal.genki-test.digdir.cloud/#/services/smoke/setup/sources]
      - [wait, --text, Nettsider, --timeout, '30000']
      - [find, role, textbox, hover, --name, Nettsider]
    hold: 1
  - say: Under Sluttresultat beskriver dere med egne ord hva brukeren skal sitte igjen med, og velger om svaret er tekst, felter, et dokument eller en tabell.
    do:
      - [open, https://portal.genki-test.digdir.cloud/#/services/smoke/setup/result]
      - [wait, --text, Hva ønsker dere å få ut av tjenesten?, --timeout, '30000']
    hold: 1
  - say: Byggeassistenten ved siden av kan gjøre endringene for dere. Alt lagres som et utkast til dere velger å publisere.
    do:
      - [find, label, Skriv til assistenten, hover]
  - say: Neste steg er å prøve tjenesten i prøveområdet, før noen andre får tilgang til den.
    hold: 1.5
